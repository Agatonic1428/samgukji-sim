                if (u.troops > 0 && u.skills.includes("yongui") && Math.random() * 100 < (75 + (u.gyeokdolChaseRateStacks || 0) * 5)) {
                  const coef = 40 + (t - 1) * 12;
                  addLog(t, u.side, `${nameTag(u)} 추격 전법 [용의주도] 발동! (전체 적군 ${coef}% 책략 피해)`);
                  alive(getEnemies(u.side)).forEach(e => dealDamage(u, e, { type: "strat", coef, isNormal: false, source: "용의주도" }));
                  const extraProb = Math.min(95, 50 * (1 + effIntel(u) / 600));
                  triggerGyeokdolChase(u);
                  if (u.troops > 0 && alive(getEnemies(u.side)).length && Math.random() * 100 < extraProb) {
                    addLog(t, u.side, `${nameTag(u)} 추격 전법 [용의주도] 추가 1회 재발동!`);
                    alive(getEnemies(u.side)).forEach(e => dealDamage(u, e, { type: "strat", coef, isNormal: false, isChase: true, source: "용의주도-추가" }));
                    triggerGyeokdolChase(u);
                  }
                }
              }
            }
          }

          // 옥새 보유자 행동 종료 시 전체 적군에게 160% 병기 피해 (통솔 영향)
          if (u.troops > 0 && u.oksaeOwner && alive(getEnemies(u.side)).length) {
            const cmdBonus = Math.max(0, (effCmd(u) - 150) * 0.15);
            addLog(t, u.side, `${nameTag(u)} 【천자 참칭-옥새】 행동 종료 전체 공격! (160% 병기 피해)`);
            alive(getEnemies(u.side)).forEach(e => dealDamage(u, e, { type: "phys", coef: 160, isNormal: false, source: "옥새", extraDmgInc: cmdBonus }));
          }

          if (!alive(allyUnits).length || !alive(enemyUnits).length) break;
        }

        // --- TURN END EFFECTS ---
        // 성운 대열 - 삼중 전열 진형 (매 턴 종료 시 지력 최고 아군이 적 전체에 60% 책략 피해)
        [["ally", allyUnits, allyBonus], ["enemy", enemyUnits, enemyBonus]].forEach(([side, units, bInfo]) => {
          const liveTeam = alive(units);
          const liveEn = alive(getEnemies(side));
          if (!liveTeam.length || !liveEn.length) return;
          if (bInfo.formation.type === "triple" && liveTeam.some(u => u.skills.includes("seongun"))) {
            const topIntel = [...liveTeam].sort((a, b) => effIntel(b) - effIntel(a))[0];
            addLog(t, side, `${nameTag(topIntel)} 【성운 대열-삼중 전열 진형】 턴 종료 책략 공격!`);
            liveEn.forEach(e => dealDamage(topIntel, e, { type: "strat", coef: 60, isNormal: false, source: "성운 대열-삼중" }));
          }
          // 훗날의 교훈: 매 턴 종료 시 전열 아군 회복 (치유율 51.5%, 지력 영향)
          liveTeam.filter(u => u.skills.includes("hutnal")).forEach(u => {
            const frontAllies = alive(units).filter(a => a.row === "front");
            const healAmt = Math.sqrt(u.troops) * 0.515 * (effIntel(u) / 140) * 1.1;
            frontAllies.forEach(fa => applyHeal(u, fa, healAmt, "훗날의 교훈", false));
          });
          // 심연의 잠룡: 4·6·8턴 종료 시 전체 적군 340%·380%·420% 피해
          if (t === 4 || t === 6 || t === 8) {
            const coefMap = { 4: 340, 6: 380, 8: 420 };
            liveTeam.filter(u => u.skills.includes("simyeon")).forEach(u => {
              const dType = effIntel(u) >= effForce(u) ? "strat" : "phys";
              const coef = coefMap[t];
              addLog(t, side, `${nameTag(u)} 【심연의 잠룡】 ${t}턴 종료 광역 폭발! (${dType === "strat" ? "책략" : "병기"} ${coef}%)`);
              alive(getEnemies(side)).forEach(e => dealDamage(u, e, { type: dType, coef, isNormal: false, source: "심연의 잠룡" }));
            });
          }
        });

        // Tick down buff/debuff durations
        allUnits.forEach(u => {
          u.tempBuffs.forEach(b => b.turns--);
          u.tempBuffs = u.tempBuffs.filter(b => b.turns > 0);
          if (u.debuffs.disarm > 0) u.debuffs.disarm--;
          if (u.debuffs.fear > 0) u.debuffs.fear--;
          if (u.debuffs.threat > 0) u.debuffs.threat--;
          if (u.debuffs.tauntTurns > 0) {
            u.debuffs.tauntTurns--;
            if (u.debuffs.tauntTurns === 0) u.debuffs.tauntBy = null;
          }
          if (u.debuffs.starve > 0) u.debuffs.starve--;
          if (u.debuffs.flood > 0) u.debuffs.flood--;
          if (u.debuffs.burn > 0) u.debuffs.burn--;
          if (u.debuffs.statDownTurns > 0) {
            u.debuffs.statDownTurns--;
            if (u.debuffs.statDownTurns === 0) {
              u.debuffs.statDownForce = 0; u.debuffs.statDownCmd = 0; u.debuffs.statDownIntel = 0; u.debuffs.statDownSpeed = 0;
            }
          }
          if (u.debuffs.dmgTakenIncTurns > 0) u.debuffs.dmgTakenIncTurns--;
          if (u.debuffs.dmgDealtDecTurns > 0) u.debuffs.dmgDealtDecTurns--;
          u.debuffs.gunjaForce = 0; u.debuffs.gunjaIntel = 0; u.debuffs.gunjaStacks = 0;
          if (u.debuffs.eumyangTurns > 0) {
            u.debuffs.eumyangTurns--;
            if (u.debuffs.eumyangTurns === 0) { u.debuffs.eumyangPhysDec = 0; u.debuffs.eumyangStratDec = 0; }
          }
          if (u.debuffs.powiTurns > 0) {
            u.debuffs.powiTurns--;
            if (u.debuffs.powiTurns === 0) u.debuffs.powiCmdDown = 0;
          }
          if (u.debuffs.silence > 0) u.debuffs.silence--;
          if (u.debuffs.sorcery > 0) u.debuffs.sorcery--;
          if (u.debuffs.hwangcheonDecTurns > 0) u.debuffs.hwangcheonDecTurns--;
          if (u.cheonjaCmdBonus > 0) {
            u.cheonjaCmdBonus = t >= 4 ? 0 : Math.max(0, u.cheonjaCmdBonus - 15);
          }
        });

        // Record history
        troopHistory.labels.push(`${t}번째 턴`);
        allUnits.forEach(u => { troopHistory.series[u.uid].push(u.troops); });

        if (!alive(enemyUnits).length) { winner = "ally"; break; }
        if (!alive(allyUnits).length) { winner = "enemy"; break; }
      }

      if (winner === "ally") {
        addLog(finalTurn, "system", "수비측 전체 무장의 병력이 0이 되어, 전투 불가 상태입니다. 공격측 승리!", "victory");
      } else if (winner === "enemy") {
        addLog(finalTurn, "system", "공격측 전체 무장의 병력이 0이 되어, 전투 불가 상태입니다. 수비측 승리!", "defeat");
      } else {
        addLog(finalTurn, "system", `${maxTurns}턴 종료 — 무승부 (잔여 병력 비교)`, "phase");
      }

      return {
        winner,
        turns: finalTurn,
        allyUnits,
        enemyUnits,
        allyFormation: allyBonus.formation,
        enemyFormation: enemyBonus.formation,
        logs,
        troopHistory
      };
    }

    // =========================================================================
    // 5. RENDERING — DECK BUILDER
    // =========================================================================
    function renderFormationSelect(selectId, selectedId) {
      const sel = document.getElementById(selectId);
      sel.innerHTML = FORMATIONS.map(f => `<option value="${f.id}" ${f.id === selectedId ? "selected" : ""}>${f.name}</option>`).join("");
    }

    function renderFormationVisual(side) {
      const deck = state.decks[side];
      const bInfo = evaluateDeckBonuses(deck);
      const f = bInfo.formation;
      const container = document.getElementById(`${side}FormationVisual`);

      const frontSlots = [];
      const backSlots = [];
      deck.slots.forEach((slot, i) => {
        const g = getGeneral(slot.generalId);
        const pos = f.slots[i];
        const card = `
          <div class="flex flex-col items-center gap-1 bg-slate-900/70 border border-slate-700/70 rounded-lg px-2 py-1.5 min-w-[74px]">
            <img src="${g.portrait}" alt="${g.name}" class="w-9 h-9 rounded-full object-cover border border-amber-400/60" />
            <span class="text-[11px] font-semibold truncate max-w-[70px]">${g.name}</span>
            <span class="text-[10px] text-amber-300">피격 ${pos.rate}%</span>
          </div>
        `;
        if (pos.row === "front") frontSlots.push(card);
        else backSlots.push(card);
      });

      const dotsHtml = `
        <div class="grid grid-cols-3 gap-1 w-8">
          ${f.dots.map(d => `<span class="formation-grid-dot ${d ? "active" : ""}"></span>`).join("")}
        </div>
      `;

      const bonusBadges = bInfo.bonuses.length
        ? bInfo.bonuses.map(b => `
            <div class="text-xs bg-slate-900/80 border border-amber-500/25 rounded-lg px-2.5 py-1.5">
              <span class="text-amber-300 font-semibold">${b.label}</span>
              <p class="text-[11px] text-slate-300 mt-0.5">${b.detail}</p>
            </div>
          `).join("")
        : `<p class="text-xs text-slate-500">적용된 추가 조합 보너스 없음</p>`;

      container.innerHTML = `
        <div class="bg-slate-950/60 border border-slate-700/60 rounded-xl p-3 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-amber-200">${f.name} 배치도</span>
            ${dotsHtml}
          </div>
          <div class="space-y-2">
            <div>
              <div class="text-[10px] text-slate-400 mb-1">전열</div>
              <div class="flex justify-center gap-2">${frontSlots.join("") || '<span class="text-[11px] text-slate-600">없음</span>'}</div>
            </div>
            <div class="border-t border-dashed border-slate-700/70 pt-1.5">
              <div class="text-[10px] text-slate-400 mb-1">후열</div>
              <div class="flex justify-center gap-2">${backSlots.join("") || '<span class="text-[11px] text-slate-600">없음</span>'}</div>
            </div>
          </div>
          <p class="text-[11px] text-emerald-300 text-center pt-1">${f.desc}</p>
        </div>
        <div class="bg-slate-950/60 border border-slate-700/60 rounded-xl p-3 space-y-2">
          <div class="text-xs font-bold text-amber-200">적용 중인 조합 보너스</div>
          <div class="space-y-1.5 max-h-64 overflow-y-auto log-scroll pr-1">${bonusBadges}</div>
        </div>
      `;
    }

    function renderDeckSlots(side) {
      const deck = state.decks[side];
      const f = getFormation(deck.formation);
      const container = document.getElementById(`${side}Slots`);

      container.innerHTML = deck.slots.map((slot, idx) => {
        normalizeSlotGear(slot);
        const g = getGeneral(slot.generalId);
        const pos = f.slots[idx];
        const eq = slot.equipConfig;
        const mt = slot.mountConfig;

        const curLv = getSlotLevel(slot, g);
        const lvStats = getStatsAtLevel(g, curLv);
        const totalForce = (lvStats.force + (Number(eq.stats.force) || 0) + (Number(mt.stats.force) || 0)).toFixed(1);
        const totalIntel = (lvStats.intel + (Number(eq.stats.intel) || 0) + (Number(mt.stats.intel) || 0)).toFixed(1);
        const totalCmd = (lvStats.command + (Number(eq.stats.command) || 0) + (Number(mt.stats.command) || 0)).toFixed(1);
        const totalSpd = (lvStats.speed + (Number(eq.stats.speed) || 0) + (Number(mt.stats.speed) || 0)).toFixed(1);

        const generalOptions = state.generals.map(gen =>
          `<option value="${gen.id}" ${gen.id === slot.generalId ? "selected" : ""}>[${gen.faction}] ${gen.name} (${gen.troopType})</option>`
        ).join("");

        const skillSelects = [0, 1, 2].map(si => {
          const isInnate = si === 0;
          const opts = state.skills.map(sk =>
            `<option value="${sk.id}" ${sk.id === slot.skills[si] ? "selected" : ""}>${sk.name} (${sk.type})</option>`
          ).join("");
          return `
            <div>
              <label class="text-[10px] text-slate-400">${isInnate ? "고유 전법" : `전법 ${si + 1}`}</label>
              <select class="form-select !py-1 !text-xs slot-skill" data-side="${side}" data-idx="${idx}" data-sidx="${si}">
                ${opts}
              </select>
            </div>
          `;
        }).join("");

        const stratSelects = [0, 1, 2].map(sti => {
          const curSt = getStrategy(slot.strategies[sti]);
          const isGold = curSt && curSt.isGoldBook;
          const selCls = isGold
            ? "form-select !py-1 !text-xs !text-orange-400 !font-bold !border-orange-400/70 !bg-orange-950/30 slot-strat"
            : "form-select !py-1 !text-xs slot-strat";
          return `
            <select class="${selCls}" data-side="${side}" data-idx="${idx}" data-stidx="${sti}">
              ${STRATEGIES.map(st => `<option value="${st.id}" ${st.id === slot.strategies[sti] ? "selected" : ""} style="${st.isGoldBook ? "color:#fb923c;font-weight:700;" : "color:#e6ebf2;"}">${st.isGoldBook ? `${st.name} (${st.owner})` : st.name}</option>`).join("")}
            </select>
          `;
        }).join("");

        return `
          <div class="bg-[#161c26] border border-slate-700/70 rounded-xl p-3 space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <img src="${g.portrait}" alt="${g.name}" class="w-11 h-11 rounded-lg object-cover border border-amber-400/50 shrink-0" />
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="px-1.5 py-0.5 text-[10px] font-bold rounded badge-faction-${g.faction}">${g.faction}</span>
                    <span class="text-xs font-bold text-amber-200">${pos.row === "front" ? "전열" : "후열"} ${idx + 1}</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">${g.troopType}</span>
                    <span class="text-[10px] text-slate-400">추천: ${g.recPos}</span>
                  </div>
                  <div class="mt-1 flex flex-wrap items-center gap-1.5">
                    <select class="form-select !py-1 !text-xs !w-40 slot-general" data-side="${side}" data-idx="${idx}">
                      ${generalOptions}
                    </select>
                    <div class="flex items-center gap-1">
                      <span class="text-[10px] text-amber-300 font-semibold">Lv</span>
                      <input type="number" min="1" max="100" value="${curLv}" ${state.maxLevelMode ? "disabled" : ""} class="form-input !py-1 !px-1.5 !text-xs !w-14 text-center slot-level ${state.maxLevelMode ? "opacity-75 !border-amber-400/50 !text-amber-200" : ""}" data-side="${side}" data-idx="${idx}" title="레벨 변경 시 성장치 기준으로 스탯 자동 계산" />
                    </div>
                    <div class="flex items-center gap-1">
                      <span class="text-[10px] text-slate-400">병력</span>
                      <input type="number" min="100" max="50000" step="100" value="${slot.troops}" class="form-input !py-1 !text-xs !w-20 text-right slot-troops" data-side="${side}" data-idx="${idx}" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-4 gap-1.5 text-center bg-slate-900/80 px-2.5 py-1.5 rounded-lg border border-slate-800 text-[11px]">
                <div><div class="text-[9px] text-slate-400">무력</div><div class="font-bold text-rose-300">${totalForce}</div></div>
                <div><div class="text-[9px] text-slate-400">지력</div><div class="font-bold text-sky-300">${totalIntel}</div></div>
                <div><div class="text-[9px] text-slate-400">통솔</div><div class="font-bold text-emerald-300">${totalCmd}</div></div>
                <div><div class="text-[9px] text-slate-400">선공</div><div class="font-bold text-amber-300">${totalSpd}</div></div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">${skillSelects}</div>

            <div class="space-y-2 pt-1.5 border-t border-slate-800/80">
              <div class="space-y-1">
                <div class="text-[10px] text-slate-400">병법 (3슬롯)</div>
                <div class="grid grid-cols-3 gap-1.5">${stratSelects}</div>
              </div>

              <!-- 장비 & 탈것 커스텀 스탯 + 스킬 선택 -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <!-- 장비 -->
                <div class="bg-slate-900/65 border border-slate-800 rounded-lg p-2 space-y-1.5">
                  <div class="flex items-center justify-between gap-1.5">
                    <span class="text-[10px] font-bold text-amber-300 shrink-0">장비</span>
                    <select class="form-select !py-0.5 !px-1.5 !text-[11px] slot-equip-preset" data-side="${side}" data-idx="${idx}">
                      ${EQUIPS.map(e => `<option value="${e.id}" ${e.id === eq.presetId ? "selected" : ""}>${e.name}</option>`).join("")}
                      <option value="custom" ${eq.presetId === "custom" ? "selected" : ""}>직접 입력</option>
                    </select>
                  </div>
                  <div class="grid grid-cols-4 gap-1">
                    ${[["force","무력"],["intel","지력"],["command","통솔"],["speed","선공"]].map(([k, lbl]) => `
                      <div>
                        <div class="text-[9px] text-slate-400 text-center">${lbl}</div>
                        <input type="number" step="0.1" value="${eq.stats[k] || 0}" class="form-input !py-0.5 !px-1 !text-[11px] text-center gear-stat" data-side="${side}" data-idx="${idx}" data-gear="equipConfig" data-stat="${k}" />
                      </div>
                    `).join("")}
                  </div>
                  <div class="grid grid-cols-2 gap-1">
                    <select class="form-select !py-0.5 !px-1 !text-[10px] gear-skill" data-side="${side}" data-idx="${idx}" data-gear="equipConfig" data-field="special">
                      ${EQUIP_SPECIALS.map(sp => `<option value="${sp.id}" ${sp.id === (eq.special || "") ? "selected" : ""}>${sp.name}</option>`).join("")}
                    </select>
                    <select class="form-select !py-0.5 !px-1 !text-[10px] gear-skill" data-side="${side}" data-idx="${idx}" data-gear="equipConfig" data-field="effect">
                      ${EQUIP_EFFECTS.map(ef => `<option value="${ef.id}" ${ef.id === (eq.effect || "") ? "selected" : ""}>${ef.name}</option>`).join("")}
                    </select>
                  </div>
                </div>

                <!-- 탈것 -->
                <div class="bg-slate-900/65 border border-slate-800 rounded-lg p-2 space-y-1.5">
                  <div class="flex items-center justify-between gap-1.5">
                    <span class="text-[10px] font-bold text-amber-300 shrink-0">탈것</span>
                    <select class="form-select !py-0.5 !px-1.5 !text-[11px] slot-mount-preset" data-side="${side}" data-idx="${idx}">
                      ${MOUNTS.map(m => `<option value="${m.id}" ${m.id === mt.presetId ? "selected" : ""}>${m.name}</option>`).join("")}
                      <option value="custom" ${mt.presetId === "custom" ? "selected" : ""}>직접 입력</option>
                    </select>
                  </div>
                  <div class="grid grid-cols-4 gap-1">
                    ${[["force","무력"],["intel","지력"],["command","통솔"],["speed","선공"]].map(([k, lbl]) => `
                      <div>
                        <div class="text-[9px] text-slate-400 text-center">${lbl}</div>
                        <input type="number" step="0.1" value="${mt.stats[k] || 0}" class="form-input !py-0.5 !px-1 !text-[11px] text-center gear-stat" data-side="${side}" data-idx="${idx}" data-gear="mountConfig" data-stat="${k}" />
                      </div>
                    `).join("")}
                  </div>
                  <div class="grid grid-cols-2 gap-1">
                    <select class="form-select !py-0.5 !px-1 !text-[10px] gear-skill" data-side="${side}" data-idx="${idx}" data-gear="mountConfig" data-field="special">
                      ${MOUNT_SPECIALS.map(sp => `<option value="${sp.id}" ${sp.id === (mt.special || "") ? "selected" : ""}>${sp.name}</option>`).join("")}
                    </select>
                    <select class="form-select !py-0.5 !px-1 !text-[10px] gear-skill" data-side="${side}" data-idx="${idx}" data-gear="mountConfig" data-field="effect">
                      ${MOUNT_EFFECTS.map(ef => `<option value="${ef.id}" ${ef.id === (mt.effect || "") ? "selected" : ""}>${ef.name}</option>`).join("")}
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");

      // Attach listeners
      container.querySelectorAll(".slot-general").forEach(el => {
        el.addEventListener("change", e => {
          const s = e.target.dataset.side, i = Number(e.target.dataset.idx);
          const g = getGeneral(e.target.value);
          state.decks[s].slots[i] = {
            generalId: g.id,
            level: g.level,
            troops: g.troops,
            skills: [...g.defaultSkills],
            strategies: [...g.defaultStrategies],
            equip: g.defaultEquip,
            mount: g.defaultMount,
            equipConfig: makeGearConfig(g.defaultEquip, false),
            mountConfig: makeGearConfig(g.defaultMount, true)
          };
          saveState();
          renderBuilder();
        });
      });
      container.querySelectorAll(".slot-troops").forEach(el => {
        el.addEventListener("change", e => {
          const s = e.target.dataset.side, i = Number(e.target.dataset.idx);
          state.decks[s].slots[i].troops = Math.max(100, Number(e.target.value) || 6000);
          saveState();
        });
      });
      container.querySelectorAll(".slot-level").forEach(el => {
        el.addEventListener("change", e => {
          const s = e.target.dataset.side, i = Number(e.target.dataset.idx);
          state.decks[s].slots[i].level = Math.max(1, Math.min(100, Number(e.target.value) || 41));
          saveState();
          renderDeckSlots(s);
        });
      });
      container.querySelectorAll(".slot-skill").forEach(el => {
        el.addEventListener("change", e => {
          const s = e.target.dataset.side, i = Number(e.target.dataset.idx), si = Number(e.target.dataset.sidx);
          state.decks[s].slots[i].skills[si] = e.target.value;
          saveState();
          renderFormationVisual(s);
        });
      });
      container.querySelectorAll(".slot-strat").forEach(el => {
        el.addEventListener("change", e => {
          const s = e.target.dataset.side, i = Number(e.target.dataset.idx), sti = Number(e.target.dataset.stidx);
          state.decks[s].slots[i].strategies[sti] = e.target.value;
          saveState();
          renderDeckSlots(s);
        });
      });
      container.querySelectorAll(".slot-equip-preset").forEach(el => {
        el.addEventListener("change", e => {
          const s = e.target.dataset.side, i = Number(e.target.dataset.idx);
          const val = e.target.value;
          if (val === "custom") {
            state.decks[s].slots[i].equipConfig.presetId = "custom";
            state.decks[s].slots[i].equipConfig.name = "커스텀 장비";
          } else {
            state.decks[s].slots[i].equip = val;
            state.decks[s].slots[i].equipConfig = makeGearConfig(val, false);
          }
          saveState();
          renderDeckSlots(s);
        });
      });
      container.querySelectorAll(".slot-mount-preset").forEach(el => {
        el.addEventListener("change", e => {
          const s = e.target.dataset.side, i = Number(e.target.dataset.idx);
          const val = e.target.value;
          if (val === "custom") {
            state.decks[s].slots[i].mountConfig.presetId = "custom";
            state.decks[s].slots[i].mountConfig.name = "커스텀 탈것";
          } else {
            state.decks[s].slots[i].mount = val;
            state.decks[s].slots[i].mountConfig = makeGearConfig(val, true);
          }
          saveState();
          renderDeckSlots(s);
        });
      });
      container.querySelectorAll(".gear-stat").forEach(el => {
        el.addEventListener("change", e => {
          const s = e.target.dataset.side, i = Number(e.target.dataset.idx);
          const gearKey = e.target.dataset.gear, statKey = e.target.dataset.stat;
          state.decks[s].slots[i][gearKey].stats[statKey] = parseFloat(e.target.value) || 0;
          saveState();
          renderDeckSlots(s);
        });
      });
      container.querySelectorAll(".gear-skill").forEach(el => {
        el.addEventListener("change", e => {
          const s = e.target.dataset.side, i = Number(e.target.dataset.idx);
          const gearKey = e.target.dataset.gear, field = e.target.dataset.field;
          state.decks[s].slots[i][gearKey][field] = e.target.value;
          saveState();
        });
      });
    }

    function renderPresets() {
      const sel = document.getElementById("presetSelect");
      sel.innerHTML = state.presets.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
    }

    function renderBuilder() {
      renderPresets();
      renderFormationSelect("allyFormation", state.decks.ally.formation);
      renderFormationSelect("enemyFormation", state.decks.enemy.formation);
      document.getElementById("allySupply").value = state.decks.ally.supply;
      document.getElementById("enemySupply").value = state.decks.enemy.supply;
      document.getElementById("allyBuildingTech").checked = Boolean(state.decks.ally.buildingTech);
      document.getElementById("enemyBuildingTech").checked = Boolean(state.decks.enemy.buildingTech);
      document.getElementById("chkMaxLevel").checked = Boolean(state.maxLevelMode);
      document.getElementById("maxLevelVal").value = state.maxLevel;
      renderFormationVisual("ally");
      renderFormationVisual("enemy");
      renderDeckSlots("ally");
      renderDeckSlots("enemy");
      lucide.createIcons();
    }

    // =========================================================================
    // 6. RENDERING — BATTLE SIMULATOR
    // =========================================================================
    function renderBattleResult(res) {
      state.lastBattle = res;
      state.activeLogTurn = "all";

      const allyStart = res.allyUnits.reduce((s, u) => s + u.maxTroops, 0);
      const allyEnd = res.allyUnits.reduce((s, u) => s + u.troops, 0);
      const allyLoss = allyStart - allyEnd;
      const enemyStart = res.enemyUnits.reduce((s, u) => s + u.maxTroops, 0);
      const enemyEnd = res.enemyUnits.reduce((s, u) => s + u.troops, 0);
      const enemyLoss = enemyStart - enemyEnd;

      const badgeText = res.winner === "ally" ? "승리" : res.winner === "enemy" ? "패배" : "무승부";
      const badgeColor = res.winner === "ally" ? "text-amber-300 border-amber-400/60 bg-amber-500/15" : res.winner === "enemy" ? "text-rose-300 border-rose-400/60 bg-rose-500/15" : "text-slate-300 border-slate-400/50 bg-slate-500/15";

      const unitCards = (units, isAlly) => units.map(u => {
        const pct = Math.round((u.troops / u.maxTroops) * 100);
        return `
          <div class="bg-slate-900/80 border ${u.troops <= 0 ? "border-rose-500/40 opacity-75" : "border-slate-700/70"} rounded-xl p-2.5 flex flex-col items-center text-center gap-1.5">
            <div class="relative">
              <img src="${u.portrait}" alt="${u.name}" class="w-12 h-12 rounded-lg object-cover border ${isAlly ? "border-sky-400/60" : "border-rose-400/60"}" />
              ${u.troops <= 0 ? '<span class="absolute inset-0 bg-black/65 rounded-lg flex items-center justify-center text-[10px] font-bold text-rose-400">궤멸</span>' : ""}
            </div>
            <div class="text-xs font-bold">${u.name}</div>
            <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
              <div class="${isAlly ? "bg-sky-400" : "bg-rose-400"} h-full" style="width:${pct}%"></div>
            </div>
            <div class="text-[10px] text-slate-300">${u.troops.toLocaleString()} / ${u.maxTroops.toLocaleString()}</div>
            <div class="text-[10px] text-rose-300">처치 ${u.totalKills.toLocaleString()} ${u.totalHeal > 0 ? `<span class="text-emerald-300 ml-1">치유 ${u.totalHeal.toLocaleString()}</span>` : ""}</div>
          </div>
        `;
      }).join("");

      document.getElementById("battleBanner").innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-11 items-center gap-4">
          <div class="md:col-span-4 space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-sky-300">아군 (${res.allyFormation.name})</span>
              <span class="text-slate-300">손실: <strong class="text-sky-300">${allyLoss.toLocaleString()}</strong></span>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
              <div class="bg-sky-400 h-full transition-all" style="width:${Math.round((allyEnd / allyStart) * 100)}%"></div>
            </div>
            <div class="text-xs text-slate-400">${allyEnd.toLocaleString()} / ${allyStart.toLocaleString()}</div>
            <div class="grid grid-cols-3 gap-2 pt-1">${unitCards(res.allyUnits, true)}</div>
          </div>

          <div class="md:col-span-3 flex flex-col items-center justify-center text-center gap-1.5 py-2">
            <div class="px-5 py-2 rounded-full border-2 text-xl font-extrabold tracking-widest ${badgeColor}">${badgeText}</div>
            <div class="text-xs text-slate-400">전투 종료: <strong class="text-amber-200">${res.turns}번째 턴</strong></div>
          </div>

          <div class="md:col-span-4 space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="text-slate-300">손실: <strong class="text-rose-300">${enemyLoss.toLocaleString()}</strong></span>
              <span class="font-bold text-rose-300">적군 (${res.enemyFormation.name})</span>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
              <div class="bg-rose-500 h-full transition-all" style="width:${Math.round((enemyEnd / enemyStart) * 100)}%"></div>
            </div>
            <div class="text-xs text-slate-400 text-right">${enemyEnd.toLocaleString()} / ${enemyStart.toLocaleString()}</div>
            <div class="grid grid-cols-3 gap-2 pt-1">${unitCards(res.enemyUnits, false)}</div>
          </div>
        </div>
      `;

      // Stats Table
      const allU = [...res.allyUnits, ...res.enemyUnits];
      document.getElementById("battleStatsTable").innerHTML = `
        <table class="w-full text-xs text-right border-collapse">
          <thead>
            <tr class="border-b border-slate-700 text-slate-400">
              <th class="py-2 text-left">항목</th>
              ${allU.map(u => `<th class="py-2 px-1.5 ${u.side === "ally" ? "text-sky-300" : "text-rose-300"}">${u.name}</th>`).join("")}
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/80">
            <tr>
              <td class="py-2 text-left text-slate-300 font-medium">총 처치</td>
              ${allU.map(u => `<td class="py-2 px-1.5 font-bold">${u.totalKills.toLocaleString()}</td>`).join("")}
            </tr>
            <tr>
              <td class="py-2 text-left text-slate-300">전법 처치</td>
              ${allU.map(u => `<td class="py-2 px-1.5">${u.skillKills.toLocaleString()}</td>`).join("")}
            </tr>
            <tr>
              <td class="py-2 text-left text-slate-300">일반공격 처치</td>
              ${allU.map(u => `<td class="py-2 px-1.5">${u.normalKills.toLocaleString()}</td>`).join("")}
            </tr>
            <tr>
              <td class="py-2 text-left text-slate-300">총 치유</td>
              ${allU.map(u => `<td class="py-2 px-1.5 text-emerald-300">${u.totalHeal.toLocaleString()}</td>`).join("")}
            </tr>
            <tr>
              <td class="py-2 text-left text-slate-300">병력 손실</td>
              ${allU.map(u => `<td class="py-2 px-1.5 text-rose-300">${(u.maxTroops - u.troops).toLocaleString()}</td>`).join("")}
            </tr>
          </tbody>
        </table>
      `;

      // Chart
      const palette = ["#f97316", "#facc15", "#34d399", "#e879f9", "#60a5fa", "#a3e635"];
      state.chartVisible = {};
      allU.forEach(u => { state.chartVisible[u.uid] = true; });

      const filtersEl = document.getElementById("chartToggleFilters");
      filtersEl.innerHTML = allU.map((u, i) => `
        <label class="inline-flex items-center gap-1 cursor-pointer select-none bg-slate-900/70 px-2 py-0.5 rounded border border-slate-700/60">
          <input type="checkbox" checked data-uid="${u.uid}" class="chart-vis-cb accent-amber-400" />
          <span class="w-2 h-2 rounded-full" style="background:${palette[i]}"></span>
          <span class="${u.side === "ally" ? "text-sky-200" : "text-rose-200"}">${u.name}</span>
        </label>
      `).join("");

      const renderChart = () => {
        if (state.chartInstance) state.chartInstance.destroy();
        const ctx = document.getElementById("troopChart").getContext("2d");
        const datasets = allU
          .filter(u => state.chartVisible[u.uid])
          .map(u => {
            const idx = allU.indexOf(u);
            return {
              label: `${u.side === "ally" ? "[아]" : "[적]"} ${u.name}`,
              data: res.troopHistory.series[u.uid],
              borderColor: palette[idx],
              backgroundColor: palette[idx],
              borderWidth: 2,
              pointRadius: 3.5,
              tension: 0.15
            };
          });
        state.chartInstance = new Chart(ctx, {
          type: "line",
          data: { labels: res.troopHistory.labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { mode: "index", intersect: false }
            },
            scales: {
              x: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.1)" } },
              y: { beginAtZero: true, ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.1)" } }
            }
          }
        });
      };

      filtersEl.querySelectorAll(".chart-vis-cb").forEach(cb => {
        cb.addEventListener("change", e => {
          state.chartVisible[e.target.dataset.uid] = e.target.checked;
          renderChart();
        });
      });
      renderChart();

      // Turn filter tabs & logs
      renderBattleLogs();
    }

    function renderBattleLogs() {
      const res = state.lastBattle;
      if (!res) return;
      const tabsEl = document.getElementById("logTurnTabs");
      const turns = ["all", 0];
      for (let t = 1; t <= res.turns; t++) turns.push(t);

      tabsEl.innerHTML = turns.map(t => {
        const label = t === "all" ? "전체" : t === 0 ? "포진" : `${t}턴`;
        const active = state.activeLogTurn === t;
        return `<button data-lturn="${t}" class="log-turn-btn px-2.5 py-1 rounded text-xs font-semibold ${active ? "bg-amber-500/25 text-amber-200 border border-amber-400/50" : "bg-slate-800 text-slate-400 hover:text-slate-200"}">${label}</button>`;
      }).join("");

      tabsEl.querySelectorAll(".log-turn-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const val = btn.dataset.lturn;
          state.activeLogTurn = val === "all" ? "all" : Number(val);
          renderBattleLogs();
        });
      });

      const filtered = state.activeLogTurn === "all" ? res.logs : res.logs.filter(l => l.turn === state.activeLogTurn);
      const container = document.getElementById("battleLogContainer");
      container.innerHTML = filtered.map(l => {
        if (l.side === "system") {
          const cls = l.highlight === "victory" ? "bg-amber-500/20 text-amber-200 border-amber-400/40 font-bold"
            : l.highlight === "defeat" ? "bg-rose-500/20 text-rose-200 border-rose-400/40 font-bold"
            : l.highlight === "order" ? "bg-slate-800/60 text-slate-300 border-slate-700/50 text-[11px]"
            : "bg-slate-800/90 text-amber-300 border-amber-500/25 font-bold";
          return `<div class="text-center py-1.5 px-3 rounded-lg border ${cls}">${l.text}</div>`;
        }
        const left = l.side === "ally" ? `<div class="bg-sky-950/35 border border-sky-500/20 rounded-lg px-2.5 py-1.5">${l.text}</div>` : `<div></div>`;
        const right = l.side === "enemy" ? `<div class="bg-rose-950/35 border border-rose-500/20 rounded-lg px-2.5 py-1.5">${l.text}</div>` : `<div></div>`;
        return `<div class="grid grid-cols-2 gap-2">${left}${right}</div>`;
      }).join("");
    }

    function runBatchSimulation(runs = 100) {
      const maxT = Math.max(1, Math.min(15, Number(document.getElementById("maxTurnsInput").value) || 8));
      let allyWins = 0, enemyWins = 0, draws = 0;
      let totalTurns = 0, totalAllyLoss = 0, totalEnemyLoss = 0;
      let lastRes = null;

      for (let i = 0; i < runs; i++) {
        const r = runBattleSimulation(maxT);
        lastRes = r;
        if (r.winner === "ally") allyWins++;
        else if (r.winner === "enemy") enemyWins++;
        else draws++;
        totalTurns += r.turns;
        totalAllyLoss += r.allyUnits.reduce((s, u) => s + (u.maxTroops - u.troops), 0);
        totalEnemyLoss += r.enemyUnits.reduce((s, u) => s + (u.maxTroops - u.troops), 0);
      }

      const card = document.getElementById("batchSummaryCard");
      card.classList.remove("hidden");
      card.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h3 class="text-sm font-bold text-amber-200">${runs}회 연속 시뮬레이션 분석 결과</h3>
          <span class="text-xs text-slate-400">평균 종료 턴: <strong class="text-amber-200">${(totalTurns / runs).toFixed(1)}턴</strong></span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center">
          <div class="bg-slate-900/80 rounded-lg p-2.5 border border-sky-500/30">
            <div class="text-[11px] text-slate-400">아군 승률</div>
            <div class="text-lg font-extrabold text-sky-300">${((allyWins / runs) * 100).toFixed(1)}%</div>
          </div>
          <div class="bg-slate-900/80 rounded-lg p-2.5 border border-rose-500/30">
            <div class="text-[11px] text-slate-400">적군 승률</div>
            <div class="text-lg font-extrabold text-rose-300">${((enemyWins / runs) * 100).toFixed(1)}%</div>
          </div>
          <div class="bg-slate-900/80 rounded-lg p-2.5 border border-slate-700">
            <div class="text-[11px] text-slate-400">무승부</div>
            <div class="text-lg font-extrabold text-slate-300">${((draws / runs) * 100).toFixed(1)}%</div>
          </div>
          <div class="bg-slate-900/80 rounded-lg p-2.5 border border-slate-700">
            <div class="text-[11px] text-slate-400">아군 평균 손실</div>
            <div class="text-lg font-bold text-sky-200">${Math.round(totalAllyLoss / runs).toLocaleString()}</div>
          </div>
          <div class="bg-slate-900/80 rounded-lg p-2.5 border border-slate-700">
            <div class="text-[11px] text-slate-400">적군 평균 손실</div>
            <div class="text-lg font-bold text-rose-200">${Math.round(totalEnemyLoss / runs).toLocaleString()}</div>
          </div>
        </div>
      `;
      renderBattleResult(lastRes);
      showToast(`${runs}회 시뮬레이션 완료!`);
    }

    // =========================================================================
    // 7. RENDERING — DATABASE & CUSTOM EDITOR
    // =========================================================================
    function renderDatabase() {
      const container = document.getElementById("dbContent");
      document.querySelectorAll(".db-tab").forEach(btn => {
        const active = btn.dataset.db === state.activeDbTab;
        if (btn.dataset.db === "add") {
          btn.className = `db-tab px-3 py-1.5 rounded-lg text-xs font-semibold ${active ? "bg-emerald-500/30 text-emerald-200 border border-emerald-400" : "bg-emerald-950/50 text-emerald-300 border border-emerald-600/40"}`;
        } else {
          btn.className = `db-tab px-3 py-1.5 rounded-lg text-xs font-semibold ${active ? "bg-amber-500/20 text-amber-200 border border-amber-500/40" : "bg-slate-800 text-slate-300 border border-slate-700"}`;
        }
      });

      if (state.activeDbTab === "generals") {
        container.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${state.generals.map(g => `
              <div class="panel p-4 space-y-3">
                <div class="flex items-center gap-3">
                  <img src="${g.portrait}" alt="${g.name}" class="w-14 h-14 rounded-xl object-cover border border-amber-400/50" />
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="px-1.5 py-0.5 text-[10px] font-bold rounded badge-faction-${g.faction}">${g.faction}</span>
                      <span class="font-bold text-base text-amber-200">${g.name}</span>
                      <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-amber-300">${g.grade}</span>
                    </div>
                    <div class="text-xs text-slate-400 mt-0.5">${g.troopType} · ${g.role} · 추천 ${g.recPos} · Lv.${g.level}</div>
                  </div>

        if (autoBtn) autoBtn.addEventListener("click", () => {
          const usedGenerals = new Set();
          const usedSkills = new Set();
          const filteredTier = state.tierDecks.filter(td => {
            const stOk = state.tierStageFilter === "all" || !td.stage || td.stage.includes(state.tierStageFilter);
            const btOk = state.tierBtFilter === "all" || !td.bt || td.bt === "모든 돌파" || td.bt === state.tierBtFilter;
            return stOk && btOk;
          });
          const tierWeight = { "T0": 32, "T0.3": 35, "T0.5": 30, "T0.8": 24, "T1": 18, "T2": 8 };
          const ranked = filteredTier.map(td => {
            let gHit = 0, sHit = 0, sTot = 0;
            td.members.forEach(m => {
              if (state.ownedGenerals.includes(m.name)) gHit++;
              (m.skills || []).forEach(sk => { sTot++; if (state.ownedSkills.includes(sk)) sHit++; });
            });
            // 미보유 장수는 뽑으면 되므로 추천 허용, 보유율 + 티어 가중치로 우선순위 결정
            const score = (gHit / Math.max(1, td.members.length)) * 50 + (sHit / Math.max(1, sTot)) * 20 + (tierWeight[td.tier] || 10);
            return { td, score };
          }).sort((a, b) => b.score - a.score);

          let filled = 0;
          for (const item of ranked) {
            if (filled >= 5) break;
            // 1) 장수 중복 불가
            if (item.td.members.some(m => usedGenerals.has(m.name))) continue;

            // 2) 전법 중복 절대 불가 (대체 전법이 비어있으면 자동 대체, 없으면 해당 덱 제외)
            const candidateSkills = new Set();
            const resolvedMembers = [];
            let skillConflict = false;
            const swappedNotes = [];

            for (const m of item.td.members) {
              const resolvedSk = [];
              for (const sk of (m.skills || [])) {
                if (!usedSkills.has(sk) && !candidateSkills.has(sk)) {
                  resolvedSk.push(sk);
                  candidateSkills.add(sk);
                } else {
                  const alt = (m.altSkills || []).find(a => !usedSkills.has(a) && !candidateSkills.has(a));
                  if (alt) {
                    resolvedSk.push(alt);
                    candidateSkills.add(alt);
                    swappedNotes.push(`${m.name}: ${sk}→${alt} 대체`);
                  } else {
                    skillConflict = true;
                    break;
                  }
                }
              }
              if (skillConflict) break;
              const foundG = state.generals.find(g => g.name === m.name);
              resolvedMembers.push({
                name: m.name,
                faction: foundG ? foundG.faction : "",
                troopType: foundG ? foundG.troopType : "",
                level: foundG ? foundG.level : "",
                pos: m.pos,
                portrait: foundG ? foundG.portrait : "",
                skills: resolvedSk,
                strategies: [...(m.strategies || [])]
              });
            }
            if (skillConflict) continue;

            // Commit non-overlapping general & skill set
            item.td.members.forEach(m => usedGenerals.add(m.name));
            candidateSkills.forEach(sk => usedSkills.add(sk));
            const missingG = item.td.members.filter(m => !state.ownedGenerals.includes(m.name)).map(m => m.name);
            const extraInfo = [
              swappedNotes.length ? `전법 중복 회피(${swappedNotes.join(", ")})` : "",
              missingG.length ? `미보유 장수: ${missingG.join(", ")}` : "보유 장수 완비"

              label: filled === 0 ? "1군 (주력)" : `${filled + 1}군`,
              formation: item.td.formation,
              note: `[자동 추천: ${item.td.tier} ${item.td.name} · ${extraInfo}] ${item.td.comment || ""}`,
              members: resolvedMembers

        const tSt = document.getElementById("tierStageSel");

                  ` : `<div class="bg-emerald-950/30 border border-emerald-500/35 rounded-lg px-3 py-1.5 text-xs text-emerald-300">이 공존덱 세트의 모든 장수와 전법을 보유 중입니다!</div>`}

                  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2.5">

                                <div class="flex items-center justify-between">
                                  <span class="font-bold ${hasG ? "text-slate-100" : "text-rose-300"}">${m.name} <span class="text-[10px] text-slate-400 font-normal">(${m.pos})</span></span>

                                </div>
                                <div class="flex flex-wrap gap-1 mt-1">
                                  ${m.skills.map(sk => {

                                    const hasS = state.ownedSkills.includes(baseSk) || state.ownedSkills.includes(sk);
                                    return `<span class="px-1.5 py-0.2 rounded text-[10px] border ${hasS ? "bg-slate-800 text-emerald-200 border-emerald-500/30" : "bg-rose-950/70 text-rose-300 border-rose-500/50 font-bold"}">${sk}${hasS ? "" : " [없음]"}</span>`;
                                  }).join("")}
                                </div>
                              </div>
                            `;
                          }).join("")}
                        </div>
                      </div>
                    `).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

        document.getElementById("coexBtFilter").addEventListener("change", e => {

    function switchTab(tab) {

        if (el) el.classList.toggle("hidden", t !== tab);
      });

        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      if (tab === "sim" && !state.lastBattle) {
        const maxT = Number(document.getElementById("maxTurnsInput").value) || 8;
        renderBattleResult(runBattleSimulation(maxT));

      if (tab === "troops") renderTroops();
      if (tab === "database") renderDatabase();
      lucide.createIcons();
    }

    function renderBattleDataBadge() {
      const badge = document.getElementById("battleDataCount");
      if (badge) badge.textContent = `${state.battleRecords.length}건`;
    }

    function computeMissingSimData() {
      const regGenerals = new Set(state.generals.map(g => g.name));
      const regSkills = new Set(state.skills.map(sk => sk.name));
      const regStrats = new Set(STRATEGIES.map(st => st.name.replace(/<|>|잔편|선본|금서/g, "").trim()));

      const neededGenerals = new Set([
        ...state.ownedGenerals,
        ...state.myTroops.flatMap(t => t.members.map(m => m.name)),
        ...state.tierDecks.flatMap(t => t.members.map(m => m.name))
      ]);
      const neededSkills = new Set([
        ...state.ownedSkills,
        ...state.myTroops.flatMap(t => t.members.flatMap(m => m.skills || [])),
        ...state.tierDecks.flatMap(t => t.members.flatMap(m => [...(m.skills || []), ...(m.altSkills || [])]))
      ]);
      const neededStrats = new Set([
        ...state.tierDecks.flatMap(t => t.members.flatMap(m => m.strategies || []))
      ]);

      const missingGenerals = [...neededGenerals].filter(n => n && !regGenerals.has(n));
      const missingSkills = [...neededSkills].filter(n => n && !regSkills.has(n));
      const missingStrats = [...neededStrats].filter(n => {
        const clean = n.replace(/<|>|잔편|선본|금서/g, "").trim();
        return clean && !regStrats.has(clean);
      });
      return { missingGenerals, missingSkills, missingStrats };
    }

    function renderMissingDataBadge() {
      const { missingGenerals, missingSkills, missingStrats } = computeMissingSimData();
      const total = missingGenerals.length + missingSkills.length + missingStrats.length;
      const el = document.getElementById("missingDataCount");
      if (el) el.textContent = `${total}건`;
    }

                <div class="flex flex-wrap gap-1">${missingSkills.map(x => chip(x, "bg-sky-950/50 text-sky-200 border-sky-500/40")).join("") || '<span class="text-xs text-emerald-300">모두 등록 완료!</span>'}</div>

        state.decks = JSON.parse(JSON.stringify(p.decks));
        saveState();
        renderBuilder();
        showToast(`프리셋 [${p.name}] 불러오기 완료`);
      });

      document.getElementById("btnSavePreset").addEventListener("click", () => {
        openModal(
          "현재 덱 조합 프리셋 저장",
          `<label class="text-xs text-slate-300">프리셋 이름</label><input id="newPresetName" class="form-input mt-1" placeholder="예: 안형진 축융부인 테스트" />`,
          [
            { label: "취소", onClick: closeModal },
            {
              label: "저장",
              className: "btn-gold px-4 py-1.5 rounded-lg text-xs",
              onClick: () => {
                const name = (document.getElementById("newPresetName").value || "").trim();
                if (!name) return;
                state.presets.push({ id: "preset_" + Date.now(), name, decks: JSON.parse(JSON.stringify(state.decks)) });
                saveState();
                renderPresets();
                closeModal();
                showToast(`프리셋 [${name}] 저장 완료`);
              }
            }
          ]
        );
      });

      document.getElementById("btnQuickSim").addEventListener("click", () => {
        document.getElementById("batchSummaryCard").classList.add("hidden");
        const maxT = Number(document.getElementById("maxTurnsInput").value) || 8;
        renderBattleResult(runBattleSimulation(maxT));
        document.getElementById("tab-battle").scrollIntoView({ behavior: "smooth", block: "start" });
        showToast("전투 시뮬레이션 완료! 아래 결과를 확인하세요.");
      });

      document.getElementById("btnRunSingle").addEventListener("click", () => {
        document.getElementById("batchSummaryCard").classList.add("hidden");
        const maxT = Number(document.getElementById("maxTurnsInput").value) || 8;
        renderBattleResult(runBattleSimulation(maxT));
        showToast("전투 시뮬레이션 완료!");
      });

      document.getElementById("btnRunBatch").addEventListener("click", () => runBatchSimulation(100));
      document.getElementById("btnBackToBuilder").addEventListener("click", () => document.getElementById("tab-builder").scrollIntoView({ behavior: "smooth", block: "start" }));

      document.querySelectorAll("#troopsSubTabs .tsub-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeTroopsSubTab = btn.dataset.tsub;
          renderTroops();
        });
      });

      document.querySelectorAll("#dbSubTabs .db-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeDbTab = btn.dataset.db;
          renderDatabase();
        });
      });

      document.getElementById("btnExportJson").addEventListener("click", () => {
        const json = JSON.stringify({ generals: state.generals, skills: state.skills, decks: state.decks, presets: state.presets, battleRecords: state.battleRecords }, null, 2);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(json).then(() => showToast("JSON 데이터를 클립보드에 복사했습니다.")).catch(() => fallbackCopy(json));
        } else {
          fallbackCopy(json);
        }
      });

      function fallbackCopy(text) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); showToast("JSON 데이터를 클립보드에 복사했습니다."); } catch (e) {}
        document.body.removeChild(ta);
      }

      document.getElementById("btnImportJson").addEventListener("click", () => {
        openModal(
          "JSON 데이터 불러오기",
          `<p class="text-xs text-slate-400">백업해 둔 JSON 데이터를 붙여넣으세요.</p><textarea id="importJsonArea" rows="6" class="form-input font-mono text-xs"></textarea>`,
          [
            { label: "취소", onClick: closeModal },
            {
              label: "적용",
              className: "btn-gold px-4 py-1.5 rounded-lg text-xs",
              onClick: () => {
                try {
                  const parsed = JSON.parse(document.getElementById("importJsonArea").value);
                  if (parsed.generals) state.generals = parsed.generals;
                  if (parsed.skills) state.skills = parsed.skills;
                  if (parsed.decks) state.decks = parsed.decks;
                  if (parsed.presets) state.presets = parsed.presets;
                  if (parsed.battleRecords) state.battleRecords = parsed.battleRecords;
                  renderBattleDataBadge();
                  saveState();
                  renderBuilder();
                  renderDatabase();
                  closeModal();
                  showToast("JSON 데이터를 적용했습니다.");
                } catch (err) {
                  showToast("올바른 JSON 형식이 아닙니다.");
                }
              }
            }
          ]
        );
      });

      document.getElementById("btnResetData").addEventListener("click", () => {
        openModal(
          "초기 데이터 복원",
          `<p class="text-xs text-slate-300">추가한 장수·전법 및 프리셋을 모두 초기화하고 기본 데이터로 되돌릴까요?</p>`,
          [
            { label: "취소", onClick: closeModal },
            {
              label: "초기화",
              className: "px-4 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold",
              onClick: () => {
                state.generals = JSON.parse(JSON.stringify(INITIAL_GENERALS));
                state.skills = JSON.parse(JSON.stringify(INITIAL_SKILLS));
                state.decks = createDefaultDecks();
                state.presets = [{ id: "default_report", name: "실제 전황 #1: 구찌집사(남만제갈) vs 12레벨 역도", decks: createDefaultDecks() }, { id: "report_2_lv10", name: "실제 전황 #2: 구찌집사(남만제갈) vs LV10 토지 수비군(서성·황충·장비)", decks: createLv10Decks() }];
                state.battleRecords = JSON.parse(JSON.stringify(INITIAL_BATTLE_RECORDS));
                renderBattleDataBadge();
                saveState();
                renderBuilder();
                renderDatabase();
                closeModal();
                showToast("초기 데이터로 복원했습니다.");
              }
            }
          ]
        );
      });

      document.getElementById("modalClose").addEventListener("click", closeModal);
      document.getElementById("appModal").addEventListener("click", e => { if (e.target.id === "appModal") closeModal(); });
      lucide.createIcons();
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
