  <style>
    :root {
      --bg-deep: #0f131a;
      --bg-panel: #171d27;
      --bg-card: #1e2634;
      --border-gold: rgba(212, 175, 55, 0.35);
      --gold: #e2be68;
      --gold-dim: #a88a44;
      --ally: #57a9f7;
      --enemy: #ef6363;
      --heal: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans KR', system-ui, sans-serif;
      background: radial-gradient(circle at top center, #1b2230 0%, #0f131a 65%);
      color: #e6ebf2;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .panel {
      background: rgba(23, 29, 39, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .panel-gold {
      background: linear-gradient(180deg, rgba(30, 38, 52, 0.95) 0%, rgba(20, 25, 34, 0.98) 100%);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .btn-gold {
      background: linear-gradient(180deg, #e5c46f 0%, #b78d35 100%);
      color: #14171f;
      font-weight: 700;
      border: 1px solid #f4dc98;
      transition: all 0.18s ease;
    }
    .btn-gold:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-gold:active { transform: translateY(0); }
    .nav-tab {
      position: relative;
      color: #94a3b8;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .nav-tab.active {
      color: #f3d584;
      background: rgba(226, 190, 104, 0.12);
    }
    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 12%;
      right: 12%;
      height: 2px;
      background: #e2be68;
      border-radius: 2px;
    }
    .badge-faction-군 { background: rgba(147, 51, 234, 0.25); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.45); }
    .badge-faction-촉 { background: rgba(22, 163, 74, 0.25); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.45); }
    .badge-faction-위 { background: rgba(37, 99, 235, 0.25); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.45); }
    .badge-faction-오 { background: rgba(220, 38, 38, 0.25); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.45); }
    .badge-type-패시브 { background: rgba(234, 179, 8, 0.18); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.35); }
    .badge-type-지휘 { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.35); }
    .badge-type-액티브 { background: rgba(244, 63, 94, 0.18); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.35); }
    .badge-type-추격 { background: rgba(249, 115, 22, 0.18); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.35); }
    .form-select, .form-input {
      background: #11161f;
      border: 1px solid rgba(148, 163, 184, 0.24);
      color: #e6ebf2;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }
    .form-select:focus, .form-input:focus {
      border-color: #e2be68;
      box-shadow: 0 0 0 2px rgba(226, 190, 104, 0.18);
    }
    .formation-grid-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: rgba(148, 163, 184, 0.25);
    }
    .formation-grid-dot.active {
      background: #e2be68;
      box-shadow: 0 0 6px rgba(226, 190, 104, 0.7);
    }
    .log-scroll::-webkit-scrollbar { width: 6px; }
    .log-scroll::-webkit-scrollbar-track { background: rgba(15, 19, 26, 0.5); }
    .log-scroll::-webkit-scrollbar-thumb { background: rgba(226, 190, 104, 0.35); border-radius: 4px; }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 60;
      padding: 10px 16px;
      border-radius: 10px;
      background: #1e2634;
      border: 1px solid #e2be68;
      color: #f8fafc;
      font-size: 0.875rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>

      const list = isMount ? MOUNTS : EQUIPS;
      const p = list.find(x => x.id === presetId) || list[0];
      return {
        presetId: p.id,
        name: p.name,
        stats: {
          force: p.stats.force || 0,
          intel: p.stats.intel || 0,
          command: p.stats.command || 0,
          speed: p.stats.speed || 0
        },
        special: p.special || "",
        effect: p.effect || ""
      };
    }

        if (parsed.decks && parsed.decks.ally && parsed.decks.enemy) {
          state.decks = parsed.decks;
          state.decks.ally.slots.forEach(normalizeSlotGear);
          state.decks.enemy.slots.forEach(normalizeSlotGear);
        }
        if (Array.isArray(parsed.presets) && parsed.presets.length) state.presets = parsed.presets;
        if (Array.isArray(parsed.battleRecords) && parsed.battleRecords.length) state.battleRecords = parsed.battleRecords;
        if (typeof parsed.maxLevel === "number") state.maxLevel = parsed.maxLevel;
        if (typeof parsed.maxLevelMode === "boolean") state.maxLevelMode = parsed.maxLevelMode;
        if (Array.isArray(parsed.myTroops) && parsed.myTroops.length) state.myTroops = parsed.myTroops;
        if (Array.isArray(parsed.tierDecks) && parsed.tierDecks.length) state.tierDecks = parsed.tierDecks;
        if (Array.isArray(parsed.ownedGenerals)) state.ownedGenerals = parsed.ownedGenerals;
        if (Array.isArray(parsed.ownedSkills)) state.ownedSkills = parsed.ownedSkills;
      } catch (e) {}
    }

    function getGeneral(id) { return state.generals.find(g => g.id === id) || state.generals[0]; }
    function getSlotLevel(slot, g) {
      if (state.maxLevelMode) return state.maxLevel;
      return Number(slot.level) || g.level || 41;
    }
    function getStatsAtLevel(g, level) {
      const diff = (Number(level) || g.level) - g.level;
      return {
        force: Math.max(1, +(g.stats.force + diff * g.growth.force).toFixed(2)),
        intel: Math.max(1, +(g.stats.intel + diff * g.growth.intel).toFixed(2)),
        command: Math.max(1, +(g.stats.command + diff * g.growth.command).toFixed(2)),
        speed: Math.max(1, +(g.stats.speed + diff * g.growth.speed).toFixed(2))
      };
    }
    function getSkill(id) { return state.skills.find(s => s.id === id) || null; }
    function getFormation(id) { return FORMATIONS.find(f => f.id === id) || FORMATIONS[0]; }
    function getStrategy(id) { return STRATEGIES.find(s => s.id === id) || STRATEGIES[0]; }
    function getEquip(id) { return EQUIPS.find(e => e.id === id) || EQUIPS[0]; }
    function getMount(id) { return MOUNTS.find(m => m.id === id) || MOUNTS[0]; }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("show"), 2400);
    }

    function openModal(title, bodyHtml, buttons) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      const footer = document.getElementById("modalFooter");
      footer.innerHTML = "";
      buttons.forEach(b => {
        const btn = document.createElement("button");
        btn.className = b.className || "px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs font-semibold";
        btn.textContent = b.label;
        btn.addEventListener("click", () => b.onClick());
        footer.appendChild(btn);
      });
      const modal = document.getElementById("appModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById("appModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    // =========================================================================
    // 3. SYNERGY & BONUS EVALUATION
    // =========================================================================
    function evaluateDeckBonuses(deck) {
      const formation = getFormation(deck.formation);
      const generals = deck.slots.map(s => getGeneral(s.generalId));
      const bonuses = [];

      // Faction bonus (2+ same faction => +5% all stats)
      const factionCounts = {};
      generals.forEach(g => { factionCounts[g.faction] = (factionCounts[g.faction] || 0) + 1; });
      let factionBonus = null;
      Object.entries(factionCounts).forEach(([fac, cnt]) => {
        if (cnt >= 2) {
          factionBonus = { faction: fac, count: cnt, pct: 5 };
          bonuses.push({ type: "진영", label: `진영 보너스-【${fac}】(${cnt})`, detail: "모든 속성 +5%" });
        }
      });

      // Troop bonus (방패병 2+: 받피 -3.5% / 창병 2+: 주피 +2.1%, 받피 -1.4%)
      const troopCounts = {};
      generals.forEach(g => { troopCounts[g.troopType] = (troopCounts[g.troopType] || 0) + 1; });
      let shieldBonus = false;
      let spearBonus = false;
      if ((troopCounts["방패병"] || 0) >= 2) {
        shieldBonus = true;
        bonuses.push({ type: "병종", label: `병종 보너스-방패병(${troopCounts["방패병"]})`, detail: "받는 피해 3.5% 감소" });
      }
      if ((troopCounts["창병"] || 0) >= 2) {
        spearBonus = true;
        bonuses.push({ type: "병종", label: `병종 보너스-창병(${troopCounts["창병"]})`, detail: "주는 피해 2.1% 증가, 받는 피해 1.4% 감소" });
      }

      // Bond bonus (남만의 대군)
      const ids = generals.map(g => g.id);
      const activeBonds = [];
      BONDS.forEach(b => {
        if (b.members.every(m => ids.includes(m))) {
          activeBonds.push(b);
          bonuses.push({ type: "인연", label: `인연-${b.name}`, detail: `이족 ${b.members.length}명 → 이족 받는 피해 ${b.members.length * 6}% 감소` });
        }
      });

      // Seongun formation boost check
      const hasSeongun = deck.slots.some(s => s.skills.includes("seongun"));
      if (hasSeongun) {
        const modeMap = { single: "단일 전열 진형", double: "이중 전열 진형", triple: "삼중 전열 진형" };
        bonuses.push({ type: "기국", label: `성운 대열 (${modeMap[formation.type]})`, detail: "진형 보너스 +70%(지력 영향) 및 기국 버프 발동" });
      }

      return { formation, factionBonus, shieldBonus, spearBonus, activeBonds, bonuses };
    }

    // =========================================================================
    // 4. BATTLE SIMULATION ENGINE (Calibrated to Real Battle Logs)
    // =========================================================================
    function runBattleSimulation(maxTurns = 8) {
      const logs = []; // { turn: 0..maxTurns, side: 'ally'|'enemy'|'system', text, highlight }
      const addLog = (turn, side, text, highlight = "") => logs.push({ turn, side, text, highlight });

      function buildUnit(slot, idx, side, deck, bonusInfo) {
        normalizeSlotGear(slot);
        const g = getGeneral(slot.generalId);
        const eq = { id: slot.equipConfig.presetId, name: slot.equipConfig.name, stats: slot.equipConfig.stats, special: slot.equipConfig.special || null, effect: slot.equipConfig.effect || null };
        const mt = { id: slot.mountConfig.presetId, name: slot.mountConfig.name, stats: slot.mountConfig.stats, special: slot.mountConfig.special || null, effect: slot.mountConfig.effect || null };
        const row = bonusInfo.formation.slots[idx].row;
        const baseHitRate = bonusInfo.formation.slots[idx].rate;

        const curLv = getSlotLevel(slot, g);
        const lvStats = getStatsAtLevel(g, curLv);
        let force = lvStats.force + (eq.stats.force || 0) + (mt.stats.force || 0);
        let intel = lvStats.intel + (eq.stats.intel || 0) + (mt.stats.intel || 0);
        let command = lvStats.command + (eq.stats.command || 0) + (mt.stats.command || 0);
        let speed = lvStats.speed + (eq.stats.speed || 0) + (mt.stats.speed || 0);

        // 진영 보너스(+5%)는 포진 단계에서 진형(+성운 대열) 적용 이후에 곱연산으로 적용됨

        const isTribe = bonusInfo.activeBonds.some(b => b.id === "nanman" && b.members.includes(g.id));

        return {
          uid: `${side}_${idx}`,
          side, idx, row, baseHitRate,
          id: g.id, name: g.name, faction: g.faction, troopType: g.troopType, grade: g.grade,
          portrait: g.portrait,
          maxTroops: Math.max(100, Number(slot.troops) || 6000),
          troops: Math.max(100, Number(slot.troops) || 6000),
          baseStats: { force, intel, command, speed },
          stats: { force, intel, command, speed },
          skills: slot.skills.filter(Boolean),
          strategies: slot.strategies.filter(s => s && s !== "none"),
          equip: eq, mount: mt,
          isTribe,
          isFemale: Boolean(g.isFemale),
          supply: deck.supply,
          // Dynamic battle states
          shieldStacks: 0, // 방어 (70~90% 감소, 최대 2스택)
          pojinSet: new Set(),
          simyeonStacks: 0,
          jiryakStacks: 0,
          sincheDmgStacks: 0,
          gunryeongStacks: 0,
          gunryeongTriggered10: false,
          gunryeongCmdBase: command,
          gunryeongCmdSteps: 0,
          guwonActive: false,
          stolenIntel: 0,
          stratLifesteal: 0, // 심리 공격
          stratPenetration: 0, // 간파
          stratCritRate: 0, // 묘책
          unsinStacks: 0, // 좌자 운신
          cheonjaCmdBonus: 0, // 천자 참칭 통솔 버프
          oksaeOwner: false, // 천자 참칭 옥새
          oksaeDmgInc: 0,
          baekjeonForce: 0,
          baekjeonIntel: 0,
          baekjeonCmd: 0,
          gyeokdolActive: false, // 군웅 격돌
          gyeokdolDmgStacks: 0,
          gyeokdolChaseRateStacks: 0,
          gyeokdolHealCountThisTurn: 0,
          dmgInc: 0,
          physDmgInc: 0,
          stratDmgInc: 0,
          dmgRed: 0,
          physDmgRed: 0,
          stratDmgRed: 0,
          normalDmgRed: 0,
          penetration: 0,
          critRate: 0,
          critDmgBonus: 0,
          doubleHitRate: 0,
          evadeRate: 0,
          lifesteal: 0, // 회유
          yeonjeonForceStacks: 0,
          yeonjeonIntelStacks: 0,
          cheonhaStacks: 0,
          tempBuffs: [], // { name, turns, ... }
          debuffs: {
            disarm: 0,       // 무장 해제
            fear: 0,         // 공포 (액티브·일반공격 불가)
            threat: 0,       // 위협 (받는 피해 10% 증가)
            tauntBy: null,   // 조롱 대상 uid
            tauntTurns: 0,
            starve: 0,       // 군량 고갈
            flood: 0,        // 홍수 (통솔 -20)
            burn: 0,         // 화공 (지력 -15)
            statDownTurns: 0,// 속성 감소 보유 여부
            statDownForce: 0,
            statDownCmd: 0,
            statDownIntel: 0,
            statDownSpeed: 0,
            permanentStatDown: false,
            dmgTakenInc: 0,
            dmgTakenIncTurns: 0,
            dmgDealtDec: 0,
            dmgDealtDecTurns: 0,
            gunjaForce: 0,
            gunjaIntel: 0,
            gunjaStacks: 0,
            eumyangPhysDec: 0,
            eumyangStratDec: 0,
            eumyangTurns: 0,
            powiCmdDown: 0,
            powiTurns: 0,
            silence: 0, // 침묵 (액티브 불가)
            sorcery: 0, // 요술
            hwangcheonDecTurns: 0
          },
          // Statistics
          totalKills: 0,
          skillKills: 0,
          normalKills: 0,
          totalHeal: 0,
          skillHits: {}
        };
      }

      const allyBonus = evaluateDeckBonuses(state.decks.ally);
      const enemyBonus = evaluateDeckBonuses(state.decks.enemy);

      const allyUnits = state.decks.ally.slots.map((s, i) => buildUnit(s, i, "ally", state.decks.ally, allyBonus));
      const enemyUnits = state.decks.enemy.slots.map((s, i) => buildUnit(s, i, "enemy", state.decks.enemy, enemyBonus));
      const allUnits = [...allyUnits, ...enemyUnits];

      const getTeam = (side) => side === "ally" ? allyUnits : enemyUnits;
      const getEnemies = (side) => side === "ally" ? enemyUnits : allyUnits;
      const alive = (arr) => arr.filter(u => u.troops > 0);
      const nameTag = (u) => `<span class="${u.side === 'ally' ? 'text-sky-300' : 'text-rose-300'} font-semibold">[${u.name}]</span>`;

      // Track troop history per turn (0 = 준비)
      const troopHistory = {
        labels: ["준비"],
        series: {}
      };
      allUnits.forEach(u => { troopHistory.series[u.uid] = [u.troops]; });

      // Helpers for effective stats
      const addDmgRed = (u, pct, key = "dmgRed") => {
        const remain = 1 - u[key] / 100;
        const added = remain * (pct / 100) * 100;
        u[key] = Math.min(95, u[key] + added);
        return added;
      };
      const teamGunryeongCmd = (u) => alive(getTeam(u.side)).reduce((s, a) => s + (a.gunryeongStacks || 0) * 25.75, 0);
      const effForce = (u) => Math.max(10, u.stats.force + u.baekjeonForce + u.yeonjeonForceStacks * 16 + u.cheonhaStacks * 20 + (u.stats.force >= u.stats.intel ? u.simyeonStacks * 4 : 0) - u.debuffs.statDownForce - u.debuffs.gunjaForce + u.tempBuffs.reduce((s, b) => s + (b.forceAdd || 0), 0));
      const effIntel = (u) => Math.max(10, u.stats.intel + u.baekjeonIntel + u.yeonjeonIntelStacks * 16 + u.cheonhaStacks * 20 + (u.stats.intel > u.stats.force ? u.simyeonStacks * 4 : 0) + u.stolenIntel - u.debuffs.statDownIntel - u.debuffs.gunjaIntel - (u.debuffs.burn > 0 ? 15 : 0) + u.tempBuffs.reduce((s, b) => s + (b.intelAdd || 0), 0));
      const effCmd = (u) => Math.max(10, u.stats.command + u.baekjeonCmd + u.cheonjaCmdBonus + teamGunryeongCmd(u) - u.debuffs.statDownCmd - (u.debuffs.powiTurns > 0 ? u.debuffs.powiCmdDown : 0) - (u.debuffs.flood > 0 ? 20 : 0) + u.tempBuffs.reduce((s, b) => s + (b.cmdAdd || 0), 0));
      const hasStatDown = (u) => u.debuffs.permanentStatDown || u.debuffs.statDownTurns > 0 || u.debuffs.flood > 0 || u.debuffs.burn > 0 || u.debuffs.powiTurns > 0;
      const hasAnyDebuff = (u) => hasStatDown(u) || u.debuffs.disarm > 0 || u.debuffs.fear > 0 || u.debuffs.silence > 0 || u.debuffs.sorcery > 0 || u.debuffs.threat > 0 || u.debuffs.starve > 0 || u.debuffs.tauntTurns > 0;

      // ==================== PHASE 0: 포진 ====================
      addLog(0, "system", "◆ 포진 단계 시작 — 부대 강화 및 지휘/패시브 전법 적용 ◆", "phase");

      [["ally", allyUnits, allyBonus], ["enemy", enemyUnits, enemyBonus]].forEach(([side, units, bInfo]) => {
        const leader = units[0];
        const supplyPenalty = Math.max(0, 100 - leader.supply);
        addLog(0, side, `${nameTag(leader)} 부대 공급 수치: ${leader.supply} (주는 피해 ${supplyPenalty}% 감소)`);

        // 1) 진형 + 성운 대열 진형 증폭 (실측: 70% + 지력 * 0.1405%)
        const seongunUnit = units.find(u => u.skills.includes("seongun"));
        const formMult = seongunUnit ? (1 + 0.70 + (effIntel(seongunUnit) * 0.001405)) : 1;

        const f = bInfo.formation;
        addLog(0, side, `${nameTag(leader)} 부대 【진형-${f.name}】 적용${seongunUnit ? ` (성운 대열 진형 보너스 +${((formMult - 1) * 100).toFixed(1)}%)` : ""}`);
        units.forEach(u => {
          if (u.row === "front") {
            if (f.frontCommand) u.stats.command += f.frontCommand * formMult;
            if (f.frontDmgRed) addDmgRed(u, f.frontDmgRed * formMult);
            if (f.frontDmgInc) u.dmgInc += f.frontDmgInc * formMult;
            if (f.frontEvade) u.evadeRate += f.frontEvade * formMult;
          } else {
            if (f.backDmgInc) u.dmgInc += f.backDmgInc * formMult;
            if (f.backDmgRed) addDmgRed(u, f.backDmgRed * formMult);
            if (f.backDoubleHit) u.doubleHitRate += f.backDoubleHit * formMult;
            if (f.backCrit) u.critRate += f.backCrit * formMult;
          }
        });

        // 2) 진영 보너스 (+5%, 진형 합산 이후 곱연산 적용)
        if (bInfo.factionBonus) {
          units.forEach(u => {
            u.stats.force *= 1.05;
            u.stats.intel *= 1.05;
            u.stats.command *= 1.05;
            u.stats.speed *= 1.05;
          });
          addLog(0, side, `${nameTag(leader)} 부대 【${bInfo.factionBonus.faction}】 진영 강화: 모든 속성 +5%`);
        }

        // 3) 병종 보너스 (방패병 2+: 받피 -3.5% / 창병 2+: 주피 +2.1%, 받피 -1.4%)
        if (bInfo.shieldBonus) {
          units.forEach(u => addDmgRed(u, 3.5));
          addLog(0, side, `${nameTag(leader)} 부대 【방패병】 병종 강화: 받는 피해 3.50% 감소`);
        }
        if (bInfo.spearBonus) {
          units.forEach(u => { u.dmgInc += 2.1; addDmgRed(u, 1.4); });
          addLog(0, side, `${nameTag(leader)} 부대 【창병】 병종 강화: 주는 피해 2.10% 증가, 받는 피해 1.40% 감소`);
        }

        // 4) 건물 기술 보너스 (전 스탯 +6, 주피 +0.5%, 받피 -0.5%)
        const deckObj = side === "ally" ? state.decks.ally : state.decks.enemy;
        if (deckObj.buildingTech) {
          units.forEach(u => {
            u.stats.force += 6; u.stats.intel += 6; u.stats.command += 6; u.stats.speed += 6;
            u.dmgInc += 0.5;
            addDmgRed(u, 0.5);
          });
          addLog(0, side, `${nameTag(leader)} 부대 【건물 기술】 적용: 전 스탯 +6, 주는 피해 +0.5%, 받는 피해 -0.5%`);
        }

        // 5) 인연 보너스 (곱연산 체감 중첩)
        if (bInfo.activeBonds.length) {
          const tribeCount = units.filter(u => u.isTribe).length;
          units.forEach(u => { if (u.isTribe) addDmgRed(u, tribeCount * 6); });
          addLog(0, side, `${nameTag(leader)} 부대 【인연-남만의 대군】 발동: 이족 받는 피해 ${tribeCount * 6}% 감소`);
        }

        // 6) 장비 & 탈것 패시브
        units.forEach(u => {
          if (u.equip.id !== "none" || u.equip.special || u.equip.effect || u.equip.stats.force || u.equip.stats.intel || u.equip.stats.command || u.equip.stats.speed) {
            if (u.equip.effect === "불굴") u.normalDmgRed += 8;
            if (u.equip.effect === "영광") u.stratDmgInc += 3;
            if (u.equip.effect === "수심") u.critDmgBonus += 5;
            addLog(0, side, `${nameTag(u)} 【장비-${u.equip.name}】 효과 발동`);
          }
          if (u.mount.id !== "none" || u.mount.special || u.mount.effect || u.mount.stats.force || u.mount.stats.intel || u.mount.stats.command || u.mount.stats.speed) {
            if (u.mount.effect === "투영") u.dmgInc += 2;
            if (u.mount.effect === "교감") u.critDmgBonus += 5;
            addLog(0, side, `${nameTag(u)} 【말-${u.mount.name}】 효과 발동`);
          }
          // 7) 병법 패시브
          u.strategies.forEach(st => {
            const stObj = getStrategy(st);
            if (stObj && stObj.isGoldBook) {
              addLog(0, side, `${nameTag(u)} <span class="text-orange-400 font-bold">【${stObj.name}】</span> 고유 병법 발동`);
            }
            if (st === "wangdo") u.dmgInc += 3.3;
            if (st === "hyeongi" && u.row === "back") u.dmgInc += 6;
            if (st === "hapjeon") addDmgRed(u, 5.5, "physDmgRed");
            if (st === "bonam" && u.row === "front") {
              addDmgRed(u, 5);
              // 실측: 맹획 통솔 318.66 기준 적 최고 속성 5.66% 감소 + 속성 감소 상태 부여
              const pct = 0.03 * (1 + effCmd(u) / 360);
              getEnemies(side).forEach(e => {
                const maxKey = ["force", "intel", "command", "speed"].sort((a, b) => e.stats[b] - e.stats[a])[0];
                e.stats[maxKey] *= (1 - pct);
                e.debuffs.permanentStatDown = true;
              });
            }
          });
        });

        // 8) 패시브 / 지휘 전법 (실측 계수 반영)
        units.forEach(u => {
          if (u.skills.includes("sharp_insight")) {
            u.penetration += 16; u.dmgInc += 35;
            addLog(0, side, `${nameTag(u)} 전법 [예리한 통찰] 발동 (관통+16%, 주는 피해+35%)`);
          }
          if (u.skills.includes("chimchak")) {
            u.stats.command += 30;
            addLog(0, side, `${nameTag(u)} 전법 [침착한 지휘] 발동 (통솔+30)`);
          }
          if (u.skills.includes("nambang_guard")) {
            // 실측: 통솔 318.66 기준 비이족 12.82%, 이족 19.23%
            const baseRed = 8.24 * (1 + effCmd(u) / 573);
            units.forEach(a => addDmgRed(a, a.isTribe ? baseRed * 1.5 : baseRed, "physDmgRed"));
            addLog(0, side, `${nameTag(u)} 전법 [남방 수호] 발동 (아군 받는 병기 피해 감소)`);
          }
          if (u.skills.includes("seongun")) {
            // 실측: 지력 313.44 기준 아군 14.50%, 자신 18.85%
            const baseRed = 10 * (1 + effIntel(u) / 696);
            units.forEach(a => addDmgRed(a, a.uid === u.uid ? baseRed * 1.3 : baseRed, "stratDmgRed"));
            addLog(0, side, `${nameTag(u)} 전법 [성운 대열] 발동 (아군 받는 책략 피해 감소 및 기국 부여)`);
          }
          if (u.skills.includes("chimryak")) {
            // 실측: 지력 313.44 기준 30.28%
            const red = 24 * (1 + effIntel(u) / 1198);
            const picks = [...units].sort(() => Math.random() - 0.5).slice(0, 2);
            picks.forEach(p => p.tempBuffs.push({ name: "침략 방어", turns: 3, dmgRed: red }));
            addLog(0, side, `${nameTag(u)} 전법 [침략 방어] 발동 (${picks.map(p => p.name).join(", ")} 3턴간 피해 감소)`);
          }
          if (u.skills.includes("heojeom")) {
            const others = units.filter(x => x.uid !== u.uid);
            const allyPick = others.length ? others[Math.floor(Math.random() * others.length)] : null;
            u.tempBuffs.push({ name: "허점 공략", turns: 4, dmgRed: 29.9 });
            if (allyPick) allyPick.tempBuffs.push({ name: "허점 공략", turns: 4, dmgRed: 29.9 });
            addLog(0, side, `${nameTag(u)} 전법 [허점 공략] 발동 (4턴간 받는 피해 29.9% 감소)`);
          }
          if (u.skills.includes("gongseonggye")) {
            addLog(0, side, `${nameTag(u)} 전법 [공성계] 발동 (초반 3턴 액티브 발동률 감소)`);
          }
          if (u.skills.includes("baekri")) {
            addLog(0, side, `${nameTag(u)} 전법 [백리의성] 발동 (초반 4턴 피격 직전 방어 획득)`);
          }
          if (u.skills.includes("jineung")) {
            const others = units.filter(x => x.uid !== u.uid);
            const picks = [...others].sort(() => Math.random() - 0.5).slice(0, 2);
            picks.forEach(p => { p.stats.intel += 13.8; });
            addLog(0, side, `${nameTag(u)} 전법 [지능 개발] 발동 (${picks.map(p => p.name).join(", ")} 지력 +13.8)`);
          }
          if (u.skills.includes("gwollyeok")) {
            const stealRed = 10 * (1 + effIntel(u) / 600);
            const ePicks = [...getEnemies(side)].sort(() => Math.random() - 0.5).slice(0, 2);
            ePicks.forEach(e => { e.dmgRed = Math.max(0, e.dmgRed - stealRed); addDmgRed(u, stealRed); });
            const slowestAlly = [...units].sort((a, b) => a.stats.speed - b.stats.speed)[0];
            if (slowestAlly) slowestAlly.guwonActive = true;
            addLog(0, side, `${nameTag(u)} 전법 [권력의 상징] 발동 (적 2명 받피감 ${stealRed.toFixed(1)}% 탈취, ${slowestAlly ? slowestAlly.name : ""}에게 구원 부여)`);
          }
          if (u.skills.includes("sinsok")) {
            const red = 12.36 * (1 + effCmd(u) / 550);
            addDmgRed(u, red);
            u.gunryeongCmdBase = effCmd(u);
            addLog(0, side, `${nameTag(u)} 전법 [신속 출병] 발동 (자신 받는 피해 ${red.toFixed(1)}% 감소)`);
          }
          if (u.skills.includes("simyeon")) {
            addLog(0, side, `${nameTag(u)} 전법 [심연의 잠룡] 발동 (첫 3턴 일반공격 불가·피격 시 속성 축적, 4·6·8턴 광역 폭발)`);
          }
          if (u.skills.includes("sobok")) {
            addLog(0, side, `${nameTag(u)} 전법 [검소한 소복] 발동 (초반 4턴 아군 누적 피해 2,000마다 소복 및 방어 부여)`);
          }
          if (u.skills.includes("eumyang")) {
            addLog(0, side, `${nameTag(u)} 전법 [음양 조화] 발동 (피격 직전 35% 확률 공격자 약화 및 회복)`);
          }
          if (u.skills.includes("gunja")) {
            addLog(0, side, `${nameTag(u)} 전법 [군자의 복수] 발동 (첫 3턴 피격 후 공격자 무력·지력 감소)`);
          }
          if (u.skills.includes("cheonja")) {
            const cmdAdd = 80 * (1 + effCmd(u) / 600);
            units.forEach(a => { a.cheonjaCmdBonus += cmdAdd; });
            addLog(0, side, `${nameTag(u)} 전법 [천자 참칭] 발동 (초반 4턴 전체 아군 통솔 +${cmdAdd.toFixed(1)}, 매 턴 -15)`);
          }
          if (u.skills.includes("baekjeon")) {
            addLog(0, side, `${nameTag(u)} 전법 [백전불태] 발동 (최고 통솔/지력/무력 아군 피격 시 60% 확률 스탯 축적)`);
          }
          if (u.skills.includes("gunung")) {
            const allQun = units.length === 3 && units.every(a => a.faction === "군");
            if (allQun) {
              const topForce = [...units].sort((a, b) => effForce(b) - effForce(a))[0];
              if (topForce) topForce.gyeokdolActive = true;
              addLog(0, side, `${nameTag(u)} 전법 [군웅 격돌] 발동! (군 진영 3인 충족 → ${topForce ? topForce.name : ""}에게 격돌 부여)`);
            } else {
              addLog(0, side, `${nameTag(u)} 전법 [군웅 격돌] 미발동 (아군 3인 모두 군 진영 필요)`);
            }
          }
          if (u.skills.includes("ucheon")) {
            u.unsinStacks = 10;
            addLog(0, side, `${nameTag(u)} 전법 [우천의 흑운] 발동 (운신 10스택 획득)`);
          }
          if (u.skills.includes("ilsim")) {
            addLog(0, side, `${nameTag(u)} 전법 [일심협력] 발동 (매 턴 행동 시 자신과 랜덤 우군 회복)`);
          }
          if (u.skills.includes("jeonjaeng")) {
            addLog(0, side, `${nameTag(u)} 전법 [전쟁 종식] 발동 (첫 3턴 시작 시 전체 아군 72.8% 방어 1스택)`);
          }
          if (u.skills.includes("taepyeong")) {
            addLog(0, side, `${nameTag(u)} 전법 [태평의 여운] 발동 (아군 액티브 발동 시 80% 연계 책략 피해)`);
          }
        });
      });

      // Active skill rate reduction from 공성계 (turns 1-3)
      function getActiveRatePenalty(turn) {
        if (turn > 3) return 0;
        let pen = 0;
        allUnits.forEach(u => {
          if (u.troops > 0 && u.skills.includes("gongseonggye")) {
            pen += 12.36 * (1 + effIntel(u) / 993);
          }
        });
        return pen;
      }

      // Heal helper
      function applyHeal(healer, target, rawAmount, sourceName, ignoreStarve = false) {
        if (target.troops <= 0 || rawAmount <= 0) return 0;
        let amount = rawAmount;
        if (!ignoreStarve && target.debuffs.starve > 0) {
          amount *= 0.30;
        }
        const actual = Math.min(target.maxTroops - target.troops, Math.round(amount));
        if (actual > 0) {
          target.troops += actual;
          healer.totalHeal += actual;
          teamTotalHeal[healer.side] = (teamTotalHeal[healer.side] || 0) + actual;
          addLog(currentTurn, healer.side, `${nameTag(healer)} 【${sourceName}】 → ${nameTag(target)} 병력 <span class="text-emerald-400 font-bold">+${actual}</span> 회복${(!ignoreStarve && target.debuffs.starve > 0) ? " (군량 고갈 70%↓)" : ""}`);
        }
        return actual;
      }

      // Damage helper
      let currentTurn = 1;
      const chimchakTriggeredThisTurn = new Set();
      const sinsokTriggeredThisTurn = new Set();
      const jiryakTriggeredThisTurn = new Set();
      const eumyangCountThisTurn = {};
      const taepyeongCountThisTurn = {};

      function triggerTaepyeong(caster) {
        const allies = alive(getTeam(caster.side)).filter(a => a.skills.includes("taepyeong"));
        allies.forEach(tp => {
          const used = taepyeongCountThisTurn[tp.uid] || 0;
          const prob = Math.max(10, 80 - used * 10);
          const en = alive(getEnemies(tp.side));
          if (!en.length || Math.random() * 100 >= prob) return;
          taepyeongCountThisTurn[tp.uid] = used + 1;
          const picks = [...en].sort(() => Math.random() - 0.5).slice(0, 2);
          addLog(currentTurn, tp.side, `${nameTag(tp)} 【태평의 여운】 연계 발동! (확률 ${prob}%, 적 ${picks.length}명 140% 책략 피해)`);
          picks.forEach(e => {
            const hadSorcery = e.debuffs.sorcery > 0;
            const dmgDone = dealDamage(tp, e, { type: "strat", coef: 140, isNormal: false, source: "태평의 여운" });
            if (hadSorcery && dmgDone > 0) {
              const lowestAlly = alive(getTeam(tp.side)).sort((a, b) => a.troops - b.troops)[0];
              if (lowestAlly) {
                const healAmt = dmgDone * 0.40 * (1 + effIntel(tp) / 600);
                applyHeal(tp, lowestAlly, healAmt, "태평의 여운-요술치유", false);
              }
            }
          });
        });
      }

      function triggerGyeokdolChase(u) {
        if (!u.gyeokdolActive) return;
        if (u.gyeokdolDmgStacks < 10) u.gyeokdolDmgStacks++;
        if (u.gyeokdolHealCountThisTurn < 3) {
          u.gyeokdolHealCountThisTurn++;
          const lowestAlly = alive(getTeam(u.side)).sort((a, b) => a.troops - b.troops)[0];
          if (lowestAlly) {
            const healAmt = Math.sqrt(u.troops) * 0.80 * (effIntel(u) / 140) * 1.1;
            applyHeal(u, lowestAlly, healAmt, "군웅 격돌", false);
          }
        }
      }
      const teamTotalHeal = { ally: 0, enemy: 0 };
      const teamSobokAccum = { ally: 0, enemy: 0 };

      function checkSinsokGunryeong(u, reason) {
        if (u.troops <= 0 || !u.skills.includes("sinsok") || u.gunryeongStacks >= 10) return;
        u.gunryeongStacks = Math.min(10, u.gunryeongStacks + 1);
        addLog(currentTurn, u.side, `${nameTag(u)} 【신속 출병】 ${reason} → 군령 획득 (${u.gunryeongStacks}/10, 아군 통솔 +${(u.gunryeongStacks * 25.75).toFixed(1)})`);
        // Check +60 cmd steps
        const gainedCmd = effCmd(u) - u.gunryeongCmdBase;
        const steps = Math.floor(Math.max(0, gainedCmd) / 60);
        if (steps > u.gunryeongCmdSteps && u.gunryeongStacks < 10) {
          const extra = steps - u.gunryeongCmdSteps;
          u.gunryeongCmdSteps = steps;
          u.gunryeongStacks = Math.min(10, u.gunryeongStacks + extra);
          addLog(currentTurn, u.side, `${nameTag(u)} 【신속 출병】 통솔 +60 돌파 → 추가 군령 획득 (${u.gunryeongStacks}/10)`);
        }
        if (u.gunryeongStacks >= 10 && !u.gunryeongTriggered10) {
          u.gunryeongTriggered10 = true;
          addLog(currentTurn, u.side, `${nameTag(u)} 【신속 출병】 군령 10스택 최초 달성! 적군 전체에 267.8% 병기 피해!`);
          alive(getEnemies(u.side)).forEach(e => {
            const cmdDiffBonus = Math.max(0, (effCmd(u) - effCmd(e)) * 0.12);
            dealDamage(u, e, { type: "phys", coef: 267.8, isNormal: false, source: "신속 출병-군령10", extraDmgInc: cmdDiffBonus });
          });
        }
      }

      function dealDamage(attacker, target, opts) {
        // opts: { type: 'phys'|'strat', coef: number (100=100%), isNormal: bool, source: string, troopDiffScale: bool, extraDmgInc: number }
        if (attacker.troops <= 0 || target.troops <= 0) return 0;

        // Evade check (normal attack only)
        if (opts.isNormal && target.evadeRate > 0 && Math.random() * 100 < target.evadeRate) {
          addLog(currentTurn, attacker.side, `${nameTag(target)} 피신 발동! ${nameTag(attacker)}의 일반 공격 회피`);
          return 0;
        }

        const atkStat = opts.type === "phys" ? effForce(attacker) : effIntel(attacker);
        const defStat = opts.type === "phys" ? effCmd(target) : effIntel(target);
        const pen = (opts.type === "phys" ? attacker.penetration : attacker.stratPenetration) + attacker.tempBuffs.reduce((s, b) => s + (b.penetration || 0), 0);
        const effDef = defStat * (1 - Math.min(0.5, pen / 100));

        // Base damage scaled by sqrt(troops) * coef * stat ratio
        let dmg = Math.sqrt(attacker.troops) * (opts.coef / 100) * (atkStat / (effDef * 0.85 + 38)) * 12.2;

        // Troop difference scaling (남방의 칼날 / 남방 수호 이족)
        if (opts.troopDiffScale && target.troops > attacker.troops) {
          const diffRatio = Math.min(1.5, (target.troops - attacker.troops) / Math.max(1000, attacker.troops));
          dmg *= (1 + diffRatio * 0.42);
        }

        // Supply penalty
        const supplyMult = Math.max(0.3, 1 - Math.max(0, 100 - attacker.supply) / 100);
        dmg *= supplyMult;

        // Attacker damage increase
        let dmgInc = attacker.dmgInc + (opts.extraDmgInc || 0) + attacker.tempBuffs.reduce((s, b) => s + (b.dmgInc || 0), 0);
        dmgInc += (attacker.sincheDmgStacks || 0) * 10.6 + (attacker.oksaeDmgInc || 0) + (attacker.gyeokdolDmgStacks || 0) * 5;
        if (opts.isChase) dmgInc += (attacker.gyeokdolChaseRateStacks || 0) * 10;
        if (attacker.debuffs.hwangcheonDecTurns > 0) dmgInc -= 16;
        if (opts.type === "phys") {
          dmgInc += attacker.physDmgInc;
          if (attacker.debuffs.eumyangTurns > 0) dmgInc -= attacker.debuffs.eumyangPhysDec;
        } else {
          dmgInc += attacker.stratDmgInc + (attacker.jiryakStacks || 0) * 7 + attacker.tempBuffs.reduce((s, b) => s + (b.stratDmgInc || 0), 0);
          if (attacker.debuffs.eumyangTurns > 0) dmgInc -= attacker.debuffs.eumyangStratDec;
        }

        // <화예의 칼날> +6% vs statDown target
        if (attacker.strategies.includes("hwaye") && hasStatDown(target)) dmgInc += 6;
        // <팔진> turns 1-4 dmgInc
        const paljinAlly = getTeam(attacker.side).find(u => u.strategies.includes("paljin"));
        if (paljinAlly && currentTurn <= 4) dmgInc += 3 + effIntel(paljinAlly) * 0.005;

        // Attacker dmgDealtDec debuff (비공)
        if (attacker.debuffs.dmgDealtDecTurns > 0) dmgInc -= attacker.debuffs.dmgDealtDec;

        // Target damage reduction (곱연산 체감 중첩)
        let remainMult = 1 - target.dmgRed / 100;
        target.tempBuffs.forEach(b => { if (b.dmgRed) remainMult *= (1 - b.dmgRed / 100); });
        if (target.strategies.includes("byeongjeong") && currentTurn <= 4) remainMult *= 0.94;
        const paljinDef = getTeam(target.side).find(u => u.strategies.includes("paljin"));
        if (paljinDef && currentTurn >= 5) remainMult *= (1 - (3 + effIntel(paljinDef) * 0.005) / 100);
        if (target.skills.includes("ucheon")) {
          const ucheonRed = Math.min(60, 20 * (1 + effIntel(target) / 700) + target.unsinStacks * 1.2);
          remainMult *= (1 - ucheonRed / 100);
        }
        let dmgRed = (1 - remainMult) * 100;

        // 병기/책략 전용 피감 & 일반공격 피감은 별도 체감 합산
        if (opts.type === "phys") dmgRed += (1 - dmgRed / 100) * target.physDmgRed;
        else {
          let stratRem = 1 - target.stratDmgRed / 100;
          target.tempBuffs.forEach(b => { if (b.stratDmgRed) stratRem *= (1 - b.stratDmgRed / 100); });
          dmgRed += (1 - dmgRed / 100) * ((1 - stratRem) * 100);
        }
        if (opts.isNormal) dmgRed += (1 - dmgRed / 100) * target.normalDmgRed;

        // Target dmgTakenInc debuff (침착한 지휘) & 위협 (+10% 받는 피해: 합연산 가산)
        if (target.debuffs.dmgTakenIncTurns > 0) dmgRed -= target.debuffs.dmgTakenInc;
        if (target.debuffs.threat > 0) dmgRed -= 10;

        // 피격 직전 발동: 백리의성 (1~4턴, 아군 전체 피격 직전 25%+통솔영향 확률 방어 1스택)
        if (currentTurn <= 4) {
          const baekriOwner = alive(getTeam(target.side)).find(a => a.skills.includes("baekri"));
          if (baekriOwner) {
            const bProb = Math.min(80, 25 * (1 + effCmd(baekriOwner) / 350));
            if (Math.random() * 100 < bProb) {
              target.shieldStacks = Math.min(2, target.shieldStacks + 1);
              addLog(currentTurn, target.side, `${nameTag(target)} 【백리의성】 피격 직전 방어 1스택 획득!`);
            }
          }
        }
        // 피격 직전 발동: 전력 지원 (자신 피격 직전 50% 확률 우군 2명 회복)
        if (target.skills.includes("jeonryeok") && Math.random() < 0.50) {
          const allies = alive(getTeam(target.side)).sort((a, b) => (a.troops / a.maxTroops) - (b.troops / b.maxTroops)).slice(0, 2);
          const healAmt = Math.sqrt(target.troops) * 0.50 * ((effIntel(target) + effCmd(target)) / 240) * 1.24;
          allies.forEach(a => applyHeal(target, a, healAmt, "전력 지원", false));
        }
        // 피격 직전 발동: 음양 조화 (자신/랜덤 우군 피격 직전 35% 확률, 매 턴 최대 3회)
        const eumyangOwners = alive(getTeam(target.side)).filter(a => a.skills.includes("eumyang"));
        eumyangOwners.forEach(eo => {
          const cnt = eumyangCountThisTurn[eo.uid] || 0;
          if (cnt < 3 && Math.random() < 0.35) {
            eumyangCountThisTurn[eo.uid] = cnt + 1;
            attacker.debuffs.eumyangTurns = 2;
            if (opts.type === "phys") attacker.debuffs.eumyangPhysDec = Math.min(31.8, attacker.debuffs.eumyangPhysDec + 3.18);
            else attacker.debuffs.eumyangStratDec = Math.min(31.8, attacker.debuffs.eumyangStratDec + 3.18);
            const liveAllies = alive(getTeam(eo.side));
            const femaleCnt = liveAllies.filter(a => a.isFemale).length;
            const healCoef = 0.265 * (1 + femaleCnt * 0.10);
            const healAmt = Math.sqrt(eo.troops) * healCoef * (effIntel(eo) / 140) * 1.1;
            const others = liveAllies.filter(a => a.uid !== eo.uid);
            const healTargets = [eo, ...(others.length ? [others[Math.floor(Math.random() * others.length)]] : [])];
            addLog(currentTurn, eo.side, `${nameTag(eo)} 【음양 조화】 발동! (${attacker.name} ${opts.type === "phys" ? "병기" : "책략"} 피해 -3.18%)`);
            healTargets.forEach(ht => applyHeal(eo, ht, healAmt, "음양 조화", false));
          }
        });

        // Combine inc & red smoothly
        const incMult = Math.max(0.25, 1 + dmgInc / 100);
        const redMult = Math.max(0.12, 1 - Math.min(88, dmgRed) / 100);
        dmg *= incMult * redMult;

        // 방어 스택 (70%~90% 감소, 1스택 소모)
        let usedShield = false;
        if (target.shieldStacks > 0) {
          target.shieldStacks--;
          const shieldRed = 0.70 + Math.random() * 0.20;
          dmg *= (1 - shieldRed);
          usedShield = true;
        }

        // Crit check (남방의 칼날 40% 회심 vs 속성감소 + 기본 critRate)
        let isCrit = false;
        let critChance = attacker.critRate + (opts.type === "strat" ? attacker.stratCritRate : 0) + (opts.extraCritRate || 0) + attacker.tempBuffs.reduce((s, b) => s + (b.critRate || 0), 0);
        const nambangBladeActive = opts.type === "phys" && attacker.skills.includes("nambang_blade") && hasStatDown(target);
        if (nambangBladeActive) critChance += 40;
        if (Math.random() * 100 < critChance) {
          isCrit = true;
          dmg *= (1.5 + attacker.critDmgBonus / 100);
        }

        // Slight natural variance (+/- 5%)
        dmg *= (0.95 + Math.random() * 0.10);
        const finalDmg = Math.max(1, Math.min(target.troops, Math.round(dmg)));

        target.troops -= finalDmg;
        attacker.totalKills += finalDmg;
        if (opts.isNormal) attacker.normalKills += finalDmg;
        else attacker.skillKills += finalDmg;

        addLog(
          currentTurn,
          attacker.side,
          `↳ ${nameTag(target)} 병력 <span class="text-rose-400 font-bold">-${finalDmg}</span> 손실${isCrit ? ' <span class="text-amber-300">[회심]</span>' : ""}${usedShield ? ' <span class="text-cyan-300">[방어 경감]</span>' : ""}`
        );

        if (target.troops <= 0) {
          addLog(currentTurn, attacker.side, `${nameTag(target)}의 병력이 <span class="text-rose-500 font-bold">0</span>이 되어 전투 불능!`, "ko");
        }

        // 연전연승 stack
        if (attacker.skills.includes("yeonjeon")) {
          if (opts.type === "phys" && attacker.yeonjeonForceStacks < 8) attacker.yeonjeonForceStacks++;
          if (opts.type === "strat" && attacker.yeonjeonIntelStacks < 8) attacker.yeonjeonIntelStacks++;
        }

        // 회유 (병기 흡혈) & 심리 공격 (책략 흡혈)
        const totalLifesteal = attacker.lifesteal + attacker.tempBuffs.reduce((s, b) => s + (b.lifesteal || 0), 0);
        if (opts.type === "phys" && totalLifesteal > 0 && attacker.troops > 0) {
          applyHeal(attacker, attacker, finalDmg * (totalLifesteal / 100), "회유", true);
        }
        if (opts.type === "strat" && attacker.stratLifesteal > 0 && attacker.troops > 0) {
          applyHeal(attacker, attacker, finalDmg * (attacker.stratLifesteal / 100), "심리 공격", true);
        }

        // 남방의 칼날 치유 (병기 피해 시 목표가 속성감소 보유 & 회심 발동 시 피해의 25%*무력영향)
        if (nambangBladeActive && isCrit) {
          const lowestAlly = alive(getTeam(attacker.side)).sort((a, b) => a.troops - b.troops)[0];
          if (lowestAlly) {
            const healAmt = finalDmg * 0.25 * (1 + effForce(attacker) / 650);
            applyHeal(attacker, lowestAlly, healAmt, "남방의 칼날-치유", false);
          }
        }

        // 우금 [침착한 지휘] 피격 반격 (매 턴 처음 피해를 받은 후)
        if (target.troops > 0 && target.skills.includes("chimchak") && !chimchakTriggeredThisTurn.has(target.uid)) {
          chimchakTriggeredThisTurn.add(target.uid);
          const incPct = 10 * (1 + effCmd(target) / 300);
          const atkEnemies = alive(getTeam(attacker.side)).sort(() => Math.random() - 0.5).slice(0, 2);
          atkEnemies.forEach(e => { e.debuffs.dmgTakenInc = incPct; e.debuffs.dmgTakenIncTurns = 1; });
          addLog(currentTurn, target.side, `${nameTag(target)} 【침착한 지휘】 반격 발동!`);
          if (Math.random() < 0.60) {
            attacker.debuffs.disarm = 2;
            addLog(currentTurn, target.side, `${nameTag(attacker)}에게 「무장 해제」(2턴) 부여!`);
          }
        }

        // 심연의 잠룡 (첫 3턴 피해 받을 때마다 최고 속성 +4, 최대 8중첩)
        if (currentTurn <= 3 && target.troops > 0 && target.skills.includes("simyeon") && target.simyeonStacks < 8) {
          target.simyeonStacks++;
        }

        // 검소한 소복 (첫 4턴 아군 누적 2,000 피해마다 병력 최저 아군 2명 소복 + 50% 방어)
        if (currentTurn <= 4) {
          const sobokOwner = alive(getTeam(target.side)).find(a => a.skills.includes("sobok"));
          if (sobokOwner) {
            teamSobokAccum[target.side] += finalDmg;
            while (teamSobokAccum[target.side] >= 2000) {
              teamSobokAccum[target.side] -= 2000;
              const low2 = alive(getTeam(target.side)).sort((a, b) => a.troops - b.troops).slice(0, 2);
              const red = 15 * (1 + effIntel(sobokOwner) / 800);
              addLog(currentTurn, target.side, `${nameTag(sobokOwner)} 【검소한 소복】 누적 2,000 피해 도달 → ${low2.map(x => x.name).join(", ")} 소복 부여!`);
              low2.forEach(a => {
                const existingSobok = a.tempBuffs.filter(b => b.name === "소복").length;
                if (existingSobok < 4) a.tempBuffs.push({ name: "소복", turns: 1, dmgRed: red });
                if (Math.random() < 0.50) {
                  a.shieldStacks = Math.min(2, a.shieldStacks + 1);
                  addLog(currentTurn, target.side, `${nameTag(a)} 【검소한 소복】 방어 1스택 획득!`);
                }
              });
            }
          }
        }

        // 군자의 복수 (첫 3턴 피격 후 60% 확률 공격자 무력·지력 -50, 최대 3중첩, 턴 종료까지)
        if (currentTurn <= 3 && target.troops > 0 && target.skills.includes("gunja") && attacker.debuffs.gunjaStacks < 3 && Math.random() < 0.60) {
          const fDec = 50 * (1 + effIntel(target) / 600);
          const iDec = 50 * (1 + effCmd(target) / 600);
          attacker.debuffs.gunjaStacks++;
          attacker.debuffs.gunjaForce += fDec;
          attacker.debuffs.gunjaIntel += iDec;
          addLog(currentTurn, target.side, `${nameTag(target)} 【군자의 복수】 발동 → ${nameTag(attacker)} 무력 -${fDec.toFixed(1)}, 지력 -${iDec.toFixed(1)} (${attacker.debuffs.gunjaStacks}/3)`);
        }

        // 백전불태 (최고 통솔/지력/무력 아군 피격 시 60% 확률 해당 스탯 +7.64, 최대 8중첩)
        if (target.troops > 0) {
          const teamNow = alive(getTeam(target.side));
          const hasBaekjeon = teamNow.some(a => a.skills.includes("baekjeon"));
          if (hasBaekjeon) {
            const topCmdU = [...teamNow].sort((a, b) => effCmd(b) - effCmd(a))[0];
            const topIntU = [...teamNow].sort((a, b) => effIntel(b) - effIntel(a))[0];
            const topFrcU = [...teamNow].sort((a, b) => effForce(b) - effForce(a))[0];
            if (topCmdU && topCmdU.uid === target.uid && target.baekjeonCmd < 7.64 * 8 && Math.random() < 0.60) {
              target.baekjeonCmd += 7.64;
              if (target.skills.includes("sinsok")) checkSinsokGunryeong(target, "백전불태 통솔 증가");
            }
            if (topIntU && topIntU.uid === target.uid && target.baekjeonIntel < 7.64 * 8 && Math.random() < 0.60) target.baekjeonIntel += 7.64;
            if (topFrcU && topFrcU.uid === target.uid && target.baekjeonForce < 7.64 * 8 && Math.random() < 0.60) target.baekjeonForce += 7.64;
          }
        }

        // 신속 출병 (매 턴 첫 피격 후 군령 +1)
        if (target.troops > 0 && target.skills.includes("sinsok") && !sinsokTriggeredThisTurn.has(target.uid)) {
          sinsokTriggeredThisTurn.add(target.uid);
          checkSinsokGunryeong(target, "턴 첫 피격");
        }

        // 지략 운용 (책략 피해 후 50% 확률 랜덤 적군 일반 공격 1회, 매 턴 최대 1회)
        if (opts.type === "strat" && !opts.fromJiryak && attacker.troops > 0 && attacker.skills.includes("jiryak") && !jiryakTriggeredThisTurn.has(attacker.uid) && Math.random() < 0.50) {
          const liveEn = alive(getEnemies(attacker.side));
          if (liveEn.length) {
            jiryakTriggeredThisTurn.add(attacker.uid);
            const pick = liveEn[Math.floor(Math.random() * liveEn.length)];
            addLog(currentTurn, attacker.side, `${nameTag(attacker)} 【지략 운용】 추가 일반 공격 발동 → ${nameTag(pick)}`);
            dealDamage(attacker, pick, { type: "phys", coef: 100, isNormal: true, source: "지략 운용-일반공격", fromJiryak: true });
            if (attacker.jiryakStacks < 5) attacker.jiryakStacks++;
          }
        }

        return finalDmg;
      }

      // Trigger 남방 수호-옹호 when an enemy receives stat-down from an innate skill
      function triggerNambangGuardFollowUp(sourceUnit, affectedTargets) {
        const allies = alive(getTeam(sourceUnit.side));
        const guardOwner = allies.find(u => u.skills.includes("nambang_guard"));
        if (!guardOwner) return;
        const prob = Math.min(95, 36.05 * (1 + effCmd(guardOwner) / 300));
        const topForceAlly = [...allies].sort((a, b) => effForce(b) - effForce(a))[0];
        if (!topForceAlly) return;

        affectedTargets.forEach(t => {
          if (t.troops > 0 && Math.random() * 100 < prob) {
            addLog(currentTurn, topForceAlly.side, `${nameTag(topForceAlly)} 【남방 수호-옹호】 연계 발동!`);
            dealDamage(topForceAlly, t, {
              type: "phys",
              coef: 92.7,
              isNormal: false,
              source: "남방 수호-옹호",
              troopDiffScale: topForceAlly.isTribe
            });
          }
        });
      }

      // Action order calculation per user's exact rules
      const effSpeed = (u) => Math.max(10, u.stats.speed - (u.debuffs.statDownSpeed || 0) + u.tempBuffs.reduce((s, b) => s + (b.speedAdd || 0), 0));
      function determineActionOrder() {
        const aList = alive(allyUnits).sort((a, b) => effSpeed(b) - effSpeed(a));
        const eList = alive(enemyUnits).sort((a, b) => effSpeed(b) - effSpeed(a));
        const order = [];
        let ai = 0, ei = 0;
        while (ai < aList.length && ei < eList.length) {
          const diff = effSpeed(aList[ai]) - effSpeed(eList[ei]);
          let allyFirst = false;
          if (diff > 70) allyFirst = true;
          else if (diff < -70) allyFirst = false;
          else {
            const prob = 0.5 + (diff / 140);
            allyFirst = Math.random() < prob;
          }
          if (allyFirst) order.push(aList[ai++]);
          else order.push(eList[ei++]);
        }
        while (ai < aList.length) order.push(aList[ai++]);
        while (ei < eList.length) order.push(eList[ei++]);
        return order;
      }

      // Pick normal attack target using formation hit rates (or taunt)
      function pickNormalTarget(attacker) {
        const enemies = alive(getEnemies(attacker.side));
        if (!enemies.length) return null;
        if (attacker.debuffs.tauntTurns > 0 && attacker.debuffs.tauntBy) {
          const taunter = enemies.find(e => e.uid === attacker.debuffs.tauntBy);
          if (taunter) return taunter;
        }
        // Weighted by baseHitRate * (currentTroops / maxTroops) for front row
        const weights = enemies.map(e => {
          let w = e.baseHitRate;
          // Seongun single-front fixes front hit rate to 85%
          const enemySeongun = alive(getTeam(e.side)).find(u => u.skills.includes("seongun"));
          const enemyForm = e.side === "ally" ? allyBonus.formation : enemyBonus.formation;
          if (enemySeongun && enemyForm.type === "single" && e.row === "front") w = 85;
          if (e.row === "front") w *= (0.4 + 0.6 * (e.troops / e.maxTroops));
          return Math.max(1, w);
        });
        const sum = weights.reduce((a, b) => a + b, 0);
        let r = Math.random() * sum;
        for (let i = 0; i < enemies.length; i++) {
          r -= weights[i];
          if (r <= 0) return enemies[i];
        }
        return enemies[0];
      }

      // Helper for 남방의 칼날 steal (순차 탈취 + 무력/통솔 각각 남방 수호-옹호 개별 판정)
      function executeNambangSteal(u) {
        const enemies = alive(getEnemies(u.side));
        if (!enemies.length) return;
        const picks = [...enemies].sort(() => Math.random() - 0.5).slice(0, 2);
        picks.forEach(p => {
          if (p.troops <= 0) return;
          const stealAmt = 20 * (1 + effForce(u) / 590);
          p.debuffs.statDownTurns = Math.max(p.debuffs.statDownTurns, 1);
          // 1) 무력 감소 -> 남방 수호-옹호 1차 판정
          p.debuffs.statDownForce += stealAmt;
          addLog(currentTurn, u.side, `${nameTag(u)} 【남방의 칼날】 → ${nameTag(p)} 무력 -${stealAmt.toFixed(1)} 탈취`);
          triggerNambangGuardFollowUp(u, [p]);
          // 2) 통솔 감소 -> 남방 수호-옹호 2차 판정
          if (p.troops > 0) {
            p.debuffs.statDownCmd += stealAmt;
            addLog(currentTurn, u.side, `${nameTag(u)} 【남방의 칼날】 → ${nameTag(p)} 통솔 -${stealAmt.toFixed(1)} 탈취`);
            triggerNambangGuardFollowUp(u, [p]);
          }
          // 탈취한 스탯이 즉시 축융부인에게 합산되어 다음 대상 탈취량에 반영
          u.tempBuffs.push({ name: "남방의 칼날-탈취", turns: 1, forceAdd: stealAmt, cmdAdd: stealAmt });
        });
      }

      // ==================== MAIN TURN LOOP ====================
      let winner = "draw";
      let finalTurn = 0;

      for (let t = 1; t <= maxTurns; t++) {
        currentTurn = t;
        finalTurn = t;
        chimchakTriggeredThisTurn.clear();
        sinsokTriggeredThisTurn.clear();
        jiryakTriggeredThisTurn.clear();
        Object.keys(eumyangCountThisTurn).forEach(k => delete eumyangCountThisTurn[k]);
        Object.keys(taepyeongCountThisTurn).forEach(k => delete taepyeongCountThisTurn[k]);
        allUnits.forEach(u => { u.gyeokdolHealCountThisTurn = 0; });
        addLog(t, "system", `◆ ${t}번째 턴 시작 ◆`, "turn");

        const order = determineActionOrder();
        addLog(t, "system", `행동 순서: ${order.map(u => `${u.name}(${Math.round(u.stats.speed)})`).join(" → ")}`, "order");

        // --- TURN START EFFECTS ---
        for (const u of order) {
          if (u.troops <= 0) continue;
          const myTeam = alive(getTeam(u.side));
          const myEnemies = alive(getEnemies(u.side));
          if (!myEnemies.length) break;

          // Equipment / Mount timed specials
          if (t === 2) {
            if (u.mount.special === "약수") {
              const target = myEnemies[Math.floor(Math.random() * myEnemies.length)];
              target.debuffs.flood = 2;
              addLog(t, u.side, `${nameTag(u)} 「탈것-약수」 발동 → ${nameTag(target)} 2턴 홍수`);
            }
            if (u.equip.special === "비공") {
              const target = myEnemies[Math.floor(Math.random() * myEnemies.length)];
              target.debuffs.dmgDealtDec = 6; target.debuffs.dmgDealtDecTurns = 2;
              addLog(t, u.side, `${nameTag(u)} 「장비-비공」 발동 → ${nameTag(target)} 주는 피해 6%↓`);
            }
            if (u.mount.special === "천운") {
              u.tempBuffs.push({ name: "천운", turns: 2, penetration: 5 });
              addLog(t, u.side, `${nameTag(u)} 「탈것-천운」 발동 (관통·간파 +5%)`);
            }
            if (u.equip.special === "선방") {
              u.shieldStacks = Math.min(2, u.shieldStacks + 1);
              addLog(t, u.side, `${nameTag(u)} 「장비-선방」 발동 (방어 1스택)`);
            }
          }
          if (t === 4 && u.equip.special === "극복") {
            u.tempBuffs.push({ name: "극복", turns: 2, lifesteal: 9 });
            addLog(t, u.side, `${nameTag(u)} 「장비-극복」 발동 (회유 +9%)`);
          }

          // <화예의 칼날>: 남방의 칼날 steal at turn start
          if (u.skills.includes("nambang_blade") && u.strategies.includes("hwaye")) {
            executeNambangSteal(u);
          }

          // <병령> 선본 (turn 1: 2 allies gain 1 방어)
          if (t === 1 && u.strategies.includes("byeongryeong")) {
            const picks = [...myTeam].sort(() => Math.random() - 0.5).slice(0, 2);
            picks.forEach(p => { p.shieldStacks = Math.min(2, p.shieldStacks + 1); });
            addLog(t, u.side, `${nameTag(u)} 【<병령> 선본】 발동 (${picks.map(p => p.name).join(", ")} 방어 1스택)`);
          }

          // 보보위영
          if (u.skills.includes("bobowiyeong")) {
            const prob = Math.min(100, 60 + (t - 1) * 10.3);
            const red = 24.72 * (1 + effCmd(u) / 2560);
            const others = myTeam.filter(a => a.uid !== u.uid);
            const targets = [u, ...(others.length ? [others[Math.floor(Math.random() * others.length)]] : [])];
            targets.forEach(tg => {
              if (Math.random() * 100 < prob) {
                tg.tempBuffs.push({ name: "보보위영", turns: 1, dmgRed: red });
                addLog(t, u.side, `${nameTag(u)} 【보보위영】 발동 → ${nameTag(tg)} 받는 피해 감소`);
              }
            });
          }

          // 금성의 철벽
          if (u.skills.includes("geumseong")) {
            const prob = Math.max(10, 80 - (t - 1) * 8);
            myTeam.forEach(a => {
              if (Math.random() * 100 < prob) {
                a.shieldStacks = Math.min(2, a.shieldStacks + 1);
                addLog(t, u.side, `${nameTag(a)} 【금성의 철벽】 방어 1스택 획득 (보유: ${a.shieldStacks})`);
              }
            });
          }

          // 침략 방어 (4번째 턴 시작 시 전체 아군 회복)
          if (t === 4 && u.skills.includes("chimryak")) {
            const healBase = Math.sqrt(u.troops) * 3.6 * (effIntel(u) / 140) * 1.1;
            addLog(t, u.side, `${nameTag(u)} 【침략 방어】 4턴 전체 회복 발동!`);
            myTeam.forEach(a => applyHeal(u, a, healBase, "침략 방어", false));
          }

          // 백리의성 (4번째 턴 시작 시 자신 통솔 +40, 전체 적군 2턴 홍수)
          if (t === 4 && u.skills.includes("baekri")) {
            u.stats.command += 40;
            myEnemies.forEach(e => { e.debuffs.flood = 2; });
            addLog(t, u.side, `${nameTag(u)} 【백리의성】 4턴 효과 발동! (통솔 +40, 적 전체 2턴 홍수)`);
          }

          // 공성계 (4번째 턴 시작 시 지력 최고 책략피해↑, 지력 최저 책략피해↓)
          if (t === 4 && u.skills.includes("gongseonggye")) {
            const val = 18.54 * (1 + effIntel(u) / 350);
            const sortedIntel = [...myTeam].sort((a, b) => effIntel(b) - effIntel(a));
            if (sortedIntel.length) {
              sortedIntel[0].tempBuffs.push({ name: "공성계-증폭", turns: 5, stratDmgInc: val });
              sortedIntel[sortedIntel.length - 1].tempBuffs.push({ name: "공성계-보호", turns: 5, stratDmgRed: val });
              addLog(t, u.side, `${nameTag(u)} 【공성계】 4턴 효과 발동 (${sortedIntel[0].name} 책략↑, ${sortedIntel[sortedIntel.length - 1].name} 책략피해↓)`);
            }
          }

          // 비상한 전략 (턴 시작 시 랜덤 적 단일 책략 피해, 매 턴 +10%)
          if (u.skills.includes("bisang")) {
            const target = myEnemies[Math.floor(Math.random() * myEnemies.length)];
            const coef = 113.33 * (1 + (t - 1) * 0.10);
            addLog(t, u.side, `${nameTag(u)} 【비상한 전략】 발동!`);
            dealDamage(u, target, { type: "strat", coef, isNormal: false, source: "비상한 전략" });
          }

          // 훗날의 교훈 (매 턴 시작 시 랜덤 적 2명 92.7% 책략 피해, 누적 치유량 영향)
          if (u.skills.includes("hutnal")) {
            const healScale = 1 + Math.min(0.65, (teamTotalHeal[u.side] || 0) / 14000);
            const picks = [...myEnemies].sort(() => Math.random() - 0.5).slice(0, 2);
            addLog(t, u.side, `${nameTag(u)} 【훗날의 교훈】 턴 시작 책략 공격!`);
            picks.forEach(e => dealDamage(u, e, { type: "strat", coef: 92.7 * healScale, isNormal: false, source: "훗날의 교훈" }));
          }

          // 신체 개조 (턴 시작 시 자신 주는 피해 +10.6%, 최대 3중첩)
          if (u.skills.includes("sinche") && u.sincheDmgStacks < 3) {
            u.sincheDmgStacks++;
            addLog(t, u.side, `${nameTag(u)} 【신체 개조】 주는 피해 증가 (${u.sincheDmgStacks}/3, +${(u.sincheDmgStacks * 10.6).toFixed(1)}%)`);
          }

          // 전쟁 종식 (첫 3턴 시작 시 전체 아군 72.8% 확률 방어 1스택)
          if (t <= 3 && u.skills.includes("jeonjaeng")) {
            myTeam.forEach(a => {
              if (Math.random() * 100 < 72.8) {
                a.shieldStacks = Math.min(2, a.shieldStacks + 1);
                addLog(t, u.side, `${nameTag(a)} 【전쟁 종식】 방어 1스택 획득 (보유: ${a.shieldStacks})`);
              }
            });
          }

          // 천자 참칭 (4번째 턴 시작 시 통솔 최고 우군 옥새 획득)
          if (t === 4 && u.skills.includes("cheonja")) {
            const others = myTeam.filter(a => a.uid !== u.uid);
            const target = (others.length ? others : myTeam).sort((a, b) => effCmd(b) - effCmd(a))[0];
            if (target) {
              target.oksaeOwner = true;
              target.oksaeDmgInc = 15 * (1 + effCmd(u) / 600);
              addLog(t, u.side, `${nameTag(u)} 【천자 참칭】 → ${nameTag(target)} 옥새 획득! (피해 +${target.oksaeDmgInc.toFixed(1)}%, 행동 종료 시 적 전체 160% 병기 피해)`);
            }
          }

          if (!alive(allyUnits).length || !alive(enemyUnits).length) break;
        }

        // Check early victory after turn-start effects
        if (!alive(enemyUnits).length) { winner = "ally"; break; }
        if (!alive(allyUnits).length) { winner = "enemy"; break; }

        // --- ACTION PHASE ---
        const activePenalty = getActiveRatePenalty(t);
        for (const u of order) {
          if (u.troops <= 0) continue;
          const enemiesNow = alive(getEnemies(u.side));
          if (!enemiesNow.length) break;

          addLog(t, u.side, `▶ ${nameTag(u)} 행동 시작`, "actor");

          // 권력의 상징 - 구원 (매 턴 행동 시 랜덤 적군 2명 지력 10 탈취)
          if (u.guwonActive) {
            const gPicks = [...alive(getEnemies(u.side))].sort(() => Math.random() - 0.5).slice(0, 2);
            const stealAmt = 10 * (1 + effIntel(u) / 600);
            gPicks.forEach(e => { e.stolenIntel -= stealAmt; u.stolenIntel += stealAmt; });
            if (gPicks.length) addLog(t, u.side, `${nameTag(u)} 【권력의 상징-구원】 적 ${gPicks.length}명 지력 ${stealAmt.toFixed(1)} 탈취!`);
          }

          // 일심협력 (매 턴 행동 시 자신과 랜덤 우군 1명 회복, 치유율 92.7%)
          if (u.skills.includes("ilsim")) {
            const liveA = alive(getTeam(u.side));
            const others = liveA.filter(a => a.uid !== u.uid);
            const targets = [u, ...(others.length ? [others[Math.floor(Math.random() * others.length)]] : [])];
            const healAmt = Math.sqrt(u.troops) * 0.927 * ((effIntel(u) + effCmd(u)) / 240) * 1.15;
            targets.forEach(tg => applyHeal(u, tg, healAmt, "일심협력", false));
          }

          // 신체 개조 (행동 시 55% 개별 판정: 자가 회복 212% / 1턴 받피감 21.2%)
          if (u.skills.includes("sinche")) {
            if (Math.random() < 0.55) {
              const topStat = Math.max(effForce(u), effIntel(u), effCmd(u));
              const healAmt = Math.sqrt(u.troops) * 2.12 * (topStat / 160) * 1.05;
              applyHeal(u, u, healAmt, "신체 개조", false);
            }
            if (Math.random() < 0.55) {
              u.tempBuffs.push({ name: "신체 개조-방어", turns: 1, dmgRed: 21.2 });
              addLog(t, u.side, `${nameTag(u)} 【신체 개조】 1턴 받는 피해 21.2% 감소 획득!`);
            }
          }

          // 1) 남방의 칼날 (행동 시 탈취(화예 없을 때) + 적 전체 90% 병기 피해)
          if (u.skills.includes("nambang_blade")) {
            if (!u.strategies.includes("hwaye")) executeNambangSteal(u);
            addLog(t, u.side, `${nameTag(u)} 【남방의 칼날】 전체 공격 발동!`);
            for (const e of alive(getEnemies(u.side))) {
              dealDamage(u, e, { type: "phys", coef: 90, isNormal: false, source: "남방의 칼날", troopDiffScale: true });
            }
          }

          // 2) 필사의 돌격 (3, 5턴 행동 시 통솔·지력 -30 + 340% 병기 피해)
          if (u.skills.includes("pilsa") && (t === 3 || t === 5)) {
            const deb = 30 * (1 + effForce(u) / 400);
            addLog(t, u.side, `${nameTag(u)} 【필사의 돌격】 발동! (전체 적 통솔·지력 감소 & 340% 피해)`);
            for (const e of alive(getEnemies(u.side))) {
              e.debuffs.statDownTurns = Math.max(e.debuffs.statDownTurns, 2);
              e.debuffs.statDownCmd += deb;
              e.debuffs.statDownIntel += deb;
              dealDamage(u, e, { type: "phys", coef: 340, isNormal: false, source: "필사의 돌격" });
            }
          }

          // 3) 성운 대열 - 이중 전열 진형 기국 버프 (통솔 최저 아군 행동 시 랜덤 적 1~2명에게 160% 피해)
          const myBonus = u.side === "ally" ? allyBonus : enemyBonus;
          const mySeongun = alive(getTeam(u.side)).find(a => a.skills.includes("seongun"));
          if (mySeongun && myBonus.formation.type === "double") {
            const lowestCmd = [...alive(getTeam(u.side))].sort((a, b) => effCmd(a) - effCmd(b))[0];
            if (lowestCmd && lowestCmd.uid === u.uid) {
              const ePool = alive(getEnemies(u.side));
              const cnt = Math.min(ePool.length, Math.random() < 0.5 ? 1 : 2);
              const picks = [...ePool].sort(() => Math.random() - 0.5).slice(0, cnt);
              const dmgType = effForce(u) >= effIntel(u) ? "phys" : "strat";
              addLog(t, u.side, `${nameTag(u)} 【성운 대열-이중 전열 진형】 발동! (${cnt}명 타격)`);
              picks.forEach(e => {
                dealDamage(u, e, {
                  type: dmgType, coef: 160, isNormal: false, source: "성운 대열",
                  extraDmgInc: e.row === "front" ? 20 : 0
                });
              });
            }
          }

          // 4) Active Skills (공포 또는 침묵 상태면 발동 불가)
          if (u.debuffs.fear > 0) {
            addLog(t, u.side, `${nameTag(u)} 「공포」 효과로 액티브 전법 및 일반 공격 불가`);
          } else if (u.debuffs.silence > 0) {
            addLog(t, u.side, `${nameTag(u)} 「침묵」 효과로 액티브 전법 발동 불가`);
          }
          for (const skId of ((u.debuffs.fear > 0 || u.debuffs.silence > 0) ? [] : u.skills)) {
            if (!alive(getEnemies(u.side)).length) break;
            const sk = getSkill(skId);
            if (!sk || sk.type !== "액티브") continue;
            // 군웅 격돌: 액티브 발동 시도마다 격돌 보유자 추격 발동률 +5%·피해 +10% (최대 5중첩)
            const gyeokdolUnit = alive(getTeam(u.side)).find(a => a.gyeokdolActive);
            if (gyeokdolUnit && gyeokdolUnit.gyeokdolChaseRateStacks < 5) gyeokdolUnit.gyeokdolChaseRateStacks++;

            const effRate = Math.max(5, sk.rate - activePenalty);
            let triggered = Math.random() * 100 < effRate;
            // 우천의 흑운: 우군 액티브 미발동 시 50%(지력 영향) 확률로 운신 1스택 소모해 재판정
            if (!triggered) {
              const zuociAlly = alive(getTeam(u.side)).find(a => a.uid !== u.uid && a.skills.includes("ucheon") && a.unsinStacks > 0);
              if (zuociAlly) {
                const rerollProb = Math.min(95, 50 * (1 + effIntel(zuociAlly) / 600));
                if (Math.random() * 100 < rerollProb) {
                  zuociAlly.unsinStacks--;
                  triggered = Math.random() * 100 < effRate;
                  addLog(t, u.side, `${nameTag(zuociAlly)} 【우천의 흑운】 운신 소모(잔여 ${zuociAlly.unsinStacks}) → ${nameTag(u)} [${sk.name}] 재판정 ${triggered ? "성공!" : "실패"}`);
                }
              }
            }
            if (!triggered) continue;

            const ePool = alive(getEnemies(u.side));
            if (skId === "chanran") {
              u.tempBuffs.push({ name: "찬란한 위명-회유", turns: 2, lifesteal: 30 });
              const picks = [...ePool].sort(() => Math.random() - 0.5).slice(0, 2);
              addLog(t, u.side, `${nameTag(u)} 전법 [찬란한 위명] 발동! (회유 30%↑)`);
              picks.forEach(e => dealDamage(u, e, { type: "phys", coef: 220, isNormal: false, source: "찬란한 위명" }));
            } else if (skId === "apdo") {
              const target = [...ePool].sort((a, b) => effCmd(a) - effCmd(b))[0];
              const alreadyStarve = target.debuffs.starve > 0;
              addLog(t, u.side, `${nameTag(u)} 전법 [압도적 승리] 발동!`);
              dealDamage(u, target, { type: "phys", coef: 207.78, isNormal: false, source: "압도적 승리" });
              if (target.troops > 0) {
                target.debuffs.starve = 2;
                addLog(t, u.side, `${nameTag(target)}에게 「군량 고갈」(2턴) 부여`);
                if (alreadyStarve) {
                  dealDamage(u, target, { type: "phys", coef: 75.56, isNormal: false, source: "압도적 승리-추가" });
                }
              }
            } else if (skId === "gyeongo") {
              u.tempBuffs.push({ name: "견고한 방어", turns: 2, dmgRed: 28.33 });
              ePool.forEach(e => { e.debuffs.tauntBy = u.uid; e.debuffs.tauntTurns = 2; });
              addLog(t, u.side, `${nameTag(u)} 전법 [견고한 방어] 발동! (적군 전체 조롱 & 받는 피해 28.33%↓)`);
            } else if (skId === "cheonha") {
              u.cheonhaStacks = Math.min(2, u.cheonhaStacks + 1);
              const picks = [...ePool].sort(() => Math.random() - 0.5).slice(0, 2);
              addLog(t, u.side, `${nameTag(u)} 전법 [천하무략] 발동! (무력·지력 +20)`);
              picks.forEach(e => {
                const alreadyFlood = e.debuffs.flood > 0;
                e.debuffs.flood = 2;
                if (alreadyFlood) {
                  dealDamage(u, e, { type: "phys", coef: 100, isNormal: false, source: "천하무략" });
                  dealDamage(u, e, { type: "strat", coef: 100, isNormal: false, source: "천하무략" });
                }
              });
            } else if (skId === "hwagong") {
              addLog(t, u.side, `${nameTag(u)} 전법 [화공전술] 발동! (전체 화공 + 소각 3회)`);
              ePool.forEach(e => {
                e.debuffs.burn = 2;
                dealDamage(u, e, { type: "strat", coef: 80, isNormal: false, source: "화공전술" });
              });
              for (let k = 0; k < 3; k++) {
                const liveE = alive(getEnemies(u.side));
                if (!liveE.length) break;
                const pick = liveE[Math.floor(Math.random() * liveE.length)];
                dealDamage(u, pick, { type: "strat", coef: 80, isNormal: false, source: "화공전술-소각" });
              }
            } else if (skId === "pajuk") {
              u.tempBuffs.push({ name: "파죽지세-회심", turns: 2, critRate: 20 });
              addLog(t, u.side, `${nameTag(u)} 전법 [파죽지세] 발동! (회심 +20%, 전체 140% 병기 피해)`);
              ePool.forEach(e => dealDamage(u, e, { type: "phys", coef: 140, isNormal: false, source: "파죽지세" }));
            } else if (skId === "toero") {
              addLog(t, u.side, `${nameTag(u)} 전법 [퇴로 매복] 발동! (4회 타격, 회심 +25%)`);
              for (let k = 0; k < 4; k++) {
                const liveE = alive(getEnemies(u.side));
                if (!liveE.length) break;
                const pick = liveE[Math.floor(Math.random() * liveE.length)];
                dealDamage(u, pick, { type: "phys", coef: 97.78, isNormal: false, source: "퇴로 매복", extraCritRate: 25 });
              }
            } else if (skId === "manin") {
              addLog(t, u.side, `${nameTag(u)} 전법 [만인지적] 발동! (전체 140% 병기 피해 + 위협)`);
              ePool.forEach(e => {
                const hadThreat = e.debuffs.threat > 0;
                dealDamage(u, e, { type: "phys", coef: 140, isNormal: false, source: "만인지적" });
                if (e.troops > 0) {
                  e.debuffs.threat = 2;
                  if (hadThreat && Math.random() < 0.30) {
                    e.debuffs.fear = 1;
                    addLog(t, u.side, `${nameTag(e)}에게 「공포」(1턴) 부여!`);
                  }
                }
              });
            } else if (skId === "palbang") {
              addLog(t, u.side, `${nameTag(u)} 전법 [팔방전] 발동! (전체 115.56% 병기 피해 + 위협)`);
              ePool.forEach(e => {
                dealDamage(u, e, { type: "phys", coef: 115.56, isNormal: false, source: "팔방전" });
                if (e.troops > 0) e.debuffs.threat = 2;
              });
            } else if (skId === "mae_eungsi") {
              const grantPojin = () => {
                if (u.shieldStacks > 0) u.pojinSet.add(2);
                const avail = [1,2,3,4,5,6,7,8].filter(n => !u.pojinSet.has(n));
                if (!avail.length) return null;
                const pick = avail[Math.floor(Math.random() * avail.length)];
                u.pojinSet.add(pick);
                if (pick === 2) u.shieldStacks = Math.min(2, u.shieldStacks + 1);
                if (pick === 3) u.stratDmgInc += 8;
                if (pick === 4) u.stratCritRate += 15;
                if (pick === 5) u.stratLifesteal += 10;
                if (pick === 6) u.stats.command += 20;
                if (pick === 7) u.stats.intel += 20;
                if (pick === 8) u.stratPenetration += 20;
                return pick;
              };
              const p1 = grantPojin();
              const repoProb = Math.min(95, 50 * (1 + effIntel(u) / 600));
              let p2 = null;
              if (Math.random() * 100 < repoProb) p2 = grantPojin();
              const pojCount = Math.min(8, u.pojinSet.size);
              const coef = 50 + pojCount * 20;
              const picks = [...ePool].sort(() => Math.random() - 0.5).slice(0, 2);
              addLog(t, u.side, `${nameTag(u)} 전법 [매의 응시] 발동! (포진 ${pojCount}종 보유${p2 ? ", 재포석 성공" : ""}, 계수 ${coef}%)`);
              picks.forEach(e => dealDamage(u, e, { type: "strat", coef, isNormal: false, source: "매의 응시" }));
            } else if (skId === "powi") {
              const picks = [...ePool].sort(() => Math.random() - 0.5).slice(0, 2);
              const stealAmt = 26 * (1 + effIntel(u) / 500);
              const totalSteal = stealAmt * picks.length;
              picks.forEach(e => { e.debuffs.powiCmdDown = stealAmt; e.debuffs.powiTurns = 2; });
              const others = alive(getTeam(u.side)).filter(a => a.uid !== u.uid).sort((a, b) => effCmd(b) - effCmd(a));
              const shareTargets = others.length ? [u, others[0]] : [u];
              const shareEach = totalSteal / shareTargets.length;
              shareTargets.forEach(st => {
                st.tempBuffs.push({ name: "포위의 허점-통솔", turns: 2, cmdAdd: shareEach });
                if (st.skills.includes("sinsok")) checkSinsokGunryeong(st, "통솔 증가");
              });
              addLog(t, u.side, `${nameTag(u)} 전법 [포위의 허점] 발동! (적 ${picks.length}명 통솔 ${stealAmt.toFixed(1)} 탈취 → ${shareTargets.map(x => x.name).join(", ")} +${shareEach.toFixed(1)})`);
              picks.forEach(e => {
                const cmdDiffBonus = Math.max(0, (effCmd(u) - effCmd(e)) * 0.12);
                dealDamage(u, e, { type: "strat", coef: 180, isNormal: false, source: "포위의 허점", extraDmgInc: cmdDiffBonus });
              });
            } else if (skId === "jiryak_bangeo") {
              const topStat = Math.max(effForce(u), effIntel(u), effCmd(u), effSpeed(u));
              const amt = 41.28 * (1 + topStat / 650);
              const topCmdAlly = [...alive(getTeam(u.side))].sort((a, b) => effCmd(b) - effCmd(a))[0];
              const lowCmdEnemy = [...ePool].sort((a, b) => effCmd(a) - effCmd(b))[0];
              if (topCmdAlly) {
                topCmdAlly.shieldStacks = Math.min(2, topCmdAlly.shieldStacks + 1);
                topCmdAlly.tempBuffs.push({ name: "지략 방어", turns: 2, forceAdd: amt, intelAdd: amt, speedAdd: amt });
              }
              if (lowCmdEnemy) {
                lowCmdEnemy.debuffs.statDownTurns = Math.max(lowCmdEnemy.debuffs.statDownTurns, 2);
                lowCmdEnemy.debuffs.statDownForce += amt;
                lowCmdEnemy.debuffs.statDownIntel += amt;
                lowCmdEnemy.debuffs.statDownSpeed += amt;
              }
              addLog(t, u.side, `${nameTag(u)} 전법 [지략 방어] 발동! (${topCmdAlly ? topCmdAlly.name : ""} 방어+스탯 +${amt.toFixed(1)}, ${lowCmdEnemy ? lowCmdEnemy.name : ""} 스탯 -${amt.toFixed(1)})`);
            } else if (skId === "soksu") {
              const pick = ePool[Math.floor(Math.random() * ePool.length)];
              addLog(t, u.side, `${nameTag(u)} 전법 [속수무책] 발동! (${pick.name} 230% 책략 피해 + 침묵)`);
              dealDamage(u, pick, { type: "strat", coef: 230, isNormal: false, source: "속수무책" });
              if (pick.troops > 0) pick.debuffs.silence = Math.max(pick.debuffs.silence, 1);
            } else if (skId === "yecheuk") {
              const picks = [...ePool].sort(() => Math.random() - 0.5).slice(0, 2);
              addLog(t, u.side, `${nameTag(u)} 전법 [예측의 신] 발동! (적 ${picks.length}명 190.8% 책략 피해)`);
              picks.forEach(e => {
                dealDamage(u, e, { type: "strat", coef: 190.8, isNormal: false, source: "예측의 신" });
                if (e.troops > 0 && Math.random() < 0.50) {
                  e.debuffs.silence = Math.max(e.debuffs.silence, 1);
                  addLog(t, u.side, `${nameTag(e)}에게 「침묵」(1턴) 부여!`);
                }
              });
            } else if (skId === "heosil") {
              const picks = [...ePool].sort(() => Math.random() - 0.5).slice(0, 2);
              const steal = 20.6 * (1 + effIntel(u) / 550);
              addLog(t, u.side, `${nameTag(u)} 전법 [허실 간파] 발동! (적 ${picks.length}명 지력·통솔 ${steal.toFixed(1)} 탈취 + 144.2% 책략 피해)`);
              picks.forEach(e => {
                e.debuffs.statDownTurns = Math.max(e.debuffs.statDownTurns, 2);
                e.debuffs.statDownIntel += steal;
                e.debuffs.statDownCmd += steal;
                u.tempBuffs.push({ name: "허실 간파-탈취", turns: 2, intelAdd: steal, cmdAdd: steal });
                dealDamage(u, e, { type: "strat", coef: 144.2, isNormal: false, source: "허실 간파" });
              });
            } else if (skId === "hwangcheon") {
              addLog(t, u.side, `${nameTag(u)} 전법 [황천의 선동] 발동! (적 전체 140% 책략 피해 + 요술)`);
              ePool.forEach(e => {
                const hadSorcery = e.debuffs.sorcery > 0;
                dealDamage(u, e, { type: "strat", coef: 140, isNormal: false, source: "황천의 선동" });
                if (e.troops > 0) {
                  e.debuffs.sorcery = 2;
                  if (hadSorcery) {
                    e.debuffs.hwangcheonDecTurns = 1;
                    addLog(t, u.side, `${nameTag(e)} 요술 중첩 → 1턴 주는 피해 16% 감소!`);
                  }
                }
              });
            } else {
              // Custom user-added active skill
              const coef = sk.coef || 150;
              const targetCnt = sk.targets || 1;
              const picks = [...ePool].sort(() => Math.random() - 0.5).slice(0, targetCnt);
              addLog(t, u.side, `${nameTag(u)} 전법 [${sk.name}] 발동!`);
              picks.forEach(e => dealDamage(u, e, { type: sk.tag === "책략" ? "strat" : "phys", coef, isNormal: false, source: sk.name }));
            }
            // 태평의 여운: 아군 액티브 전법 발동 성공 후 연계 판정
            if (alive(getEnemies(u.side)).length) triggerTaepyeong(u);
          }

          // 5) Normal Attack & 추격 전법
          if (u.troops > 0 && u.debuffs.fear <= 0 && alive(getEnemies(u.side)).length) {
            if (u.debuffs.disarm > 0) {
              addLog(t, u.side, `${nameTag(u)} 「무장 해제」 효과로 일반 공격 불가`);
            } else if (t <= 3 && u.skills.includes("simyeon")) {
              addLog(t, u.side, `${nameTag(u)} 【심연의 잠룡】 초반 3턴 일반 공격 불가 (잠복 중)`);
            } else {
              const hits = 1 + (Math.random() * 100 < u.doubleHitRate ? 1 : 0);
              for (let h = 0; h < hits; h++) {
                const target = pickNormalTarget(u);
                if (!target) break;
                addLog(t, u.side, `${nameTag(u)} → ${nameTag(target)} 일반 공격${h > 0 ? " (연타!)" : ""}${u.debuffs.tauntTurns > 0 ? " [조롱]" : ""}`);
                dealDamage(u, target, { type: "phys", coef: 100, isNormal: true, source: "일반 공격" });
                // 추격: 전장 평정 (일반 공격 후 55% 확률, 목표 선공·무력 감소 후 디버프 보유 적군 전체에게 180% 병기 피해)
                if (u.troops > 0 && target.troops > 0 && u.skills.includes("jeonjang") && Math.random() * 100 < (55 + (u.gyeokdolChaseRateStacks || 0) * 5)) {
                  const debAmt = 24 * (1 + effForce(u) / 860);
                  target.debuffs.statDownTurns = Math.max(target.debuffs.statDownTurns, 2);
                  target.debuffs.statDownForce += debAmt;
                  target.debuffs.statDownSpeed += debAmt;
                  const debuffedEnemies = alive(getEnemies(u.side)).filter(e => hasAnyDebuff(e));
                  addLog(t, u.side, `${nameTag(u)} 추격 전법 [전장 평정] 발동! (${target.name} 선공·무력 -${debAmt.toFixed(1)}, 디버프 적군 ${debuffedEnemies.length}명 180% 피해)`);
                  debuffedEnemies.forEach(e => {
                    if (e.troops > 0) dealDamage(u, e, { type: "phys", coef: 180, isNormal: false, isChase: true, source: "전장 평정" });
                  });
                  triggerGyeokdolChase(u);
                }
                // 패시브: 지략 운용 (일반 공격 후 책략 피해 +7%, 최대 5중첩)
                if (u.troops > 0 && u.skills.includes("jiryak") && u.jiryakStacks < 5) {
                  u.jiryakStacks++;
                }
                // 추격: 용의주도 (75% 확률, 전체 적군 40%+(t-1)*12% 책략 피해, 50%+지력영향 추가 1회)
